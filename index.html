<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>你的恋爱人格 | 20道题深度测试</title>
  <meta name="description" content="20道深度测试题，12种恋爱人格，全面解析你在感情中的真实模样">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #E8A0BF;
      --primary-dark: #C97BA0;
      --accent: #9B8DC7;
      --bg: #FEFBF6;
      --text: #2D2D2D;
      --text-light: #777;
      --card-bg: #FFFFFF;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
      --radius: 20px;
      --radius-sm: 12px;
      --radius-xs: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      background-image: radial-gradient(circle at 20% 20%, rgba(232,160,191,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(155,141,199,0.06) 0%, transparent 50%);
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }

    /* ========== 欢迎页 ========== */
    .welcome-page {
      text-align: center;
      padding: 48px 20px 32px;
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart-icon {
      font-size: 56px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }

    .welcome-title {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 32px;
      letter-spacing: 1px;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 32px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      margin: 0 8px 32px;
    }

    .stat-item {
      flex: 1;
      padding: 20px 12px;
      text-align: center;
      position: relative;
    }
    .stat-item:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: #f0e8ee;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .types-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 32px;
      padding: 0 4px;
    }

    .type-pill {
      background: var(--card-bg);
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      cursor: default;
      border: 1px solid rgba(232,160,191,0.1);
    }
    .type-pill:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }
    .type-pill .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
    .type-pill .name { font-weight: 600; color: var(--text); font-size: 11px; }

    .start-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 18px 56px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 24px rgba(232,160,191,0.35);
      letter-spacing: 2px;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(232,160,191,0.45);
    }
    .start-btn:active {
      transform: translateY(0);
    }

    /* ========== 测试页 ========== */
    .test-page { display: none; animation: fadeUp 0.4s ease; }

    .progress-wrapper {
      margin-bottom: 20px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
    }
    .progress-count {
      font-size: 12px;
      color: var(--text-light);
    }
    .progress-bar {
      background: #F3EDF0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .question-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 22px;
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
    }
    .question-tag {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .question-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 22px;
      color: var(--text);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      background: #FAFAFA;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s ease;
      line-height: 1.5;
      color: var(--text);
    }
    .option-btn:hover {
      border-color: var(--primary);
      background: #FFF8FA;
      transform: translateX(4px);
    }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, #FFF5F8, #F8F0FF);
      box-shadow: 0 2px 8px rgba(232,160,191,0.15);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .nav-btn {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .nav-btn.prev {
      background: #F5F5F5;
      color: var(--text-light);
    }
    .nav-btn.prev:hover { background: #EEE; }
    .nav-btn.next {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      box-shadow: 0 4px 16px rgba(232,160,191,0.3);
    }
    .nav-btn.next:hover {
      box-shadow: 0 6px 20px rgba(232,160,191,0.4);
      transform: translateY(-1px);
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    /* ========== 结果页 ========== */
    .result-page { display: none; animation: fadeUp 0.6s ease; }

    .result-hero {
      text-align: center;
      padding: 40px 20px 32px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .result-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      animation: shimmer 8s linear infinite;
    }
    @keyframes shimmer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-emoji {
      font-size: 72px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
      position: relative;
    }
    .result-label {
      font-size: 13px;
      color: rgba(0,0,0,0.5);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .result-type {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      position: relative;
    }
    .result-keywords {
      font-size: 14px;
      opacity: 0.8;
      letter-spacing: 2px;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .result-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-card h3 .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .result-card p {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.8;
    }

    .trait-list { list-style: none; }
    .trait-list li {
      font-size: 14px;
      padding: 8px 0;
      color: var(--text-light);
      line-height: 1.6;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .trait-list li::before { display: none; }
    .strengths li .dot { color: #4CAF50; flex-shrink: 0; }
    .weaknesses li .dot { color: #FF9800; flex-shrink: 0; }

    .match-card {
      background: linear-gradient(135deg, #FFF5F8, #F5F0FF);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      border: 1px solid rgba(232,160,191,0.15);
    }
    .match-card h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .match-card p { font-size: 14px; color: var(--text-light); line-height: 1.8; }

    .growth-card {
      background: linear-gradient(135deg, #F0FFF8, #F8FFF5);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      border: 1px solid rgba(76,175,80,0.1);
    }
    .growth-card h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .growth-card p { font-size: 14px; color: var(--text-light); line-height: 1.8; }

    /* 维度分析 */
    .dimension-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
    }
    .dimension-section > h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dim-item { margin-bottom: 16px; }
    .dim-item:last-child { margin-bottom: 0; }
    .dim-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .dim-header .left { color: var(--text); }
    .dim-header .right { color: var(--text-light); }
    .dim-header .pct { font-weight: 700; }
    .dim-bar-bg {
      background: #F3EDF0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }
    .dim-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .dim-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    }
    .dim-name {
      font-size: 11px;
      color: var(--text-light);
      text-align: center;
      margin-top: 3px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 16px;
    }
    .action-btn {
      padding: 16px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
    }
    .action-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .action-btn:active { transform: scale(0.98); }

    /* ========== 付费区 ========== */
    .pay-section {
      background: linear-gradient(135deg, #FFF8FA, #F8F0FF);
      border: 2px solid rgba(232,160,191,0.2);
      border-radius: var(--radius);
      padding: 28px 22px;
      text-align: center;
      margin-bottom: 12px;
    }
    .pay-section h3 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .pay-section .desc {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 16px;
    }
    .pay-features { text-align: left; margin-bottom: 20px; }
    .pay-features li {
      font-size: 14px;
      padding: 6px 0;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .pay-features li::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--primary); border-radius: 50%; flex-shrink: 0; }
    .price {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .price-unit { font-size: 13px; color: var(--text-light); }
    .original-price {
      text-decoration: line-through;
      color: #ccc;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .pay-btn {
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,107,107,0.3);
      transition: all 0.3s ease;
    }
    .pay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255,107,107,0.4);
    }

    /* ========== 完整报告 ========== */
    .full-report-section {
      display: none;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-lg);
      background: linear-gradient(135deg, #FFFBF5, #FFF8FA);
      border: 2px solid rgba(232,160,191,0.2);
    }
    .full-report-section.show {
      display: block;
      animation: fadeUp 0.6s ease;
    }
    .full-report-section > h3 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(232,160,191,0.3);
      text-align: center;
    }
    .full-report-section .section-block {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .full-report-section .section-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .full-report-section .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .full-report-section .section-content {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.9;
      white-space: pre-line;
    }

    /* ========== 弹窗 ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      animation: modalIn 0.3s ease;
      box-shadow: var(--shadow-lg);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-box h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal-box .pay-info {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .wechat-box {
      background: linear-gradient(135deg, #FFF5F8, #F8F0FF);
      border: 2px dashed rgba(232,160,191,0.4);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 16px;
    }
    .wechat-box .label {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .wechat-box .id {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: 2px;
    }
    .pw-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pw-input-row input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #eee;
      border-radius: var(--radius-sm);
      font-size: 16px;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .pw-input-row input:focus { border-color: var(--primary); }
    .pw-input-row button {
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pw-input-row button:hover { opacity: 0.9; }
    .pw-error {
      color: #FF6B6B;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .pw-error.show { display: block; }

    .share-options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }
    .share-opt { text-align: center; cursor: pointer; }
    .share-opt .icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 6px;
      color: white;
      transition: transform 0.2s;
    }
    .share-opt:hover .icon { transform: scale(1.1); }
    .share-opt:nth-child(1) .icon { background: linear-gradient(135deg, #07C160, #06AD56); }
    .share-opt:nth-child(2) .icon { background: linear-gradient(135deg, var(--primary), var(--accent)); }
    .share-opt:nth-child(3) .icon { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
    .share-opt span { font-size: 11px; color: var(--text-light); }
    .modal-close {
      background: #F5F5F5;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      color: var(--text-light);
      cursor: pointer;
      padding: 10px 28px;
      transition: all 0.2s;
    }
    .modal-close:hover { background: #EEE; }

    .footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 欢迎页 -->
    <div class="welcome-page" id="welcomePage">
      <div class="heart-icon">💗</div>
      <h1 class="welcome-title">你的恋爱人格</h1>
      <p class="welcome-subtitle">20道深度测试 · 12种恋爱人格 · 全面解析</p>

      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-num">20</div>
          <div class="stat-label">道深度题目</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">5</div>
          <div class="stat-label">个核心维度</div>
        </div>
        <div class="stat-item">
          <div class="stat-num">12</div>
          <div class="stat-label">种恋爱人格</div>
        </div>

    // ========== 状态管理 ==========
    var currentQuestion = 0;
    var answers = [];

    // ========== 核心逻辑 ==========
    function startTest() {
      document.getElementById('welcomePage').style.display = 'none';
      document.getElementById('testPage').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      var q = questions[currentQuestion];
      document.getElementById('questionNum').textContent = '第' + (currentQuestion + 1) + '题';
      document.getElementById('questionTag').textContent = dimTags[currentQuestion] || '';
      document.getElementById('questionText').textContent = q.q;
      document.getElementById('progressNum').textContent = currentQuestion + 1;
      document.getElementById('progressFill').style.width = ((currentQuestion + 1) * 5) + '%';

      var container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach(function(opt, idx) {
        var btn = document.createElement('button');
        btn.className = 'option-btn' + (answers[currentQuestion] === idx ? ' selected' : '');
        btn.textContent = opt.text;
        btn.onclick = (function(i) { return function() { selectOption(i); }; })(idx);
        container.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').textContent = currentQuestion === 19 ? '查看结果' : '下一题';
    }

    function selectOption(idx) {
      answers[currentQuestion] = idx;
      var btns = document.querySelectorAll('.option-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('selected', i === idx);
      }
    }

    function nextQuestion() {
      if (answers[currentQuestion] === undefined) {
        alert('请先选择一个选项哦～');
        return;
      }
      if (currentQuestion < 19) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function calculateResult() {
      var scores = { E: 0, I: 0, N: 0, S: 0, F: 0, T: 0, J: 0, P: 0, A: 0 };

      for (var qIdx = 0; qIdx < answers.length; qIdx++) {
        var ansIdx = answers[qIdx];
        if (ansIdx === undefined) continue;
        var optionScores = questions[qIdx].options[ansIdx].scores;
        for (var key in optionScores) {
          if (optionScores.hasOwnProperty(key)) {
            scores[key] += optionScores[key];
          }
        }
      }

      var energy = scores.E >= scores.I ? 'E' : 'I';
      var info = scores.N >= scores.S ? 'N' : 'S';
      var decision = scores.F >= scores.T ? 'F' : 'T';
      var lifestyle = scores.J >= scores.P ? 'J' : 'P';
      var attach = scores.A > scores.S ? 'A' : 'S';

      var combo = energy + info + decision + lifestyle + attach;

      var map = {
        'ETSJS': 'butterfly', 'ETFJP': 'butterfly', 'ETFJS': 'flame',
        'EFSJP': 'sunflower', 'EFFJP': 'sunflower', 'EFSJS': 'flame',
        'IFSJS': 'whale', 'IFTJS': 'whale', 'IFFJS': 'moon',
        'IEFJS': 'moon', 'ISAJP': 'rose', 'ITAJP': 'rose',
        'IFAJS': 'moon', 'EFAJP': 'rose', 'ENSJP': 'siren',
        'ENTJP': 'eagle', 'NFPJP': 'fox', 'SFFJP': 'sakura',
        'SFTJP': 'clownfish', 'SJSJS': 'treecat'
      };

      if (map[combo]) return map[combo];

      if (energy === 'E' && decision === 'T' && attach === 'S') return 'butterfly';
      if (energy === 'E' && decision === 'F' && attach === 'S') return 'flame';
      if (energy === 'I' && decision === 'F' && attach === 'A') return 'moon';
      if (energy === 'I' && decision === 'T' && attach === 'S') return 'whale';
      if (decision === 'F' && attach === 'S' && lifestyle === 'P') return 'sunflower';
      if (energy === 'I' && attach === 'A') return 'rose';
      if (info === 'N' && lifestyle === 'P') return 'fox';
      if (decision === 'T' && lifestyle === 'J') return 'eagle';
      if (info === 'S' && decision === 'F') return 'sakura';
      if (info === 'S' && decision === 'T' && lifestyle === 'P') return 'clownfish';
      if (lifestyle === 'J' && attach === 'S') return 'treecat';
      if (energy === 'E' && info === 'N') return 'siren';

      return 'butterfly';
    }

      document.getElementById('reportTriggers').textContent = r.triggerPoints;
      document.getElementById('reportCommunication').textContent = r.communicationGuide;
      document.getElementById('reportTimeline').textContent = r.loveTimeline;
      document.getElementById('reportPartner').textContent = r.idealPartner;
      document.getElementById('reportGrowth').textContent = r.growthPlan;
      document.getElementById('fullReport').classList.add('show');
      document.getElementById('fullReport').scrollIntoView({ behavior: 'smooth' });
    }

    function showShareModal() { document.getElementById('shareModal').classList.add('show'); }
    function closeShareModal() { document.getElementById('shareModal').classList.remove('show'); }
    function shareTo(platform) {
      if (platform === 'copy') {
        navigator.clipboard.writeText(window.location.href).then(function() { alert('链接已复制，快去分享给朋友吧！'); });
      } else if (platform === 'wechat') {
        alert('请使用微信右上角「...」分享给朋友');
      } else {
        alert('请保存图片或复制链接分享到朋友圈');
      }
      closeShareModal();
    }
    function restartTest() {
      currentQuestion = 0;
      answers = [];
      document.getElementById('resultPage').style.display = 'none';
      document.getElementById('welcomePage').style.display = 'block';
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
