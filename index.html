 回顾：这周我有几次卸下了搞笑的面具？\n\n【每周复盘】这周有谁认真看见了我？我让自己被看见了吗？", "yearPlan": "第 1-3 个月｜练习认真\n目标：每天至少一次，不用玩笑表达真心。\n\n第 4-6 个月｜允许脆弱\n目标：让信任的人看到你不搞笑的一面。\n\n第 7-9 个月｜建立深度\n目标：谈一次真正的害怕和需要。\n\n第 10-12 个月｜被爱真实的我\n目标：从「大家喜欢我」到「有人懂我」。", "letterToFuture": "给 6 个月后，不用笑也能被喜欢的你：\n\n希望你不再需要用搞笑来换喜欢。\n\n希望你遇到一个人，ta 喜欢你的幽默，也认真对待你的沉默。\n\n你可以继续逗大家笑，但也请允许自己难过、认真、需要人陪。\n\n被看见真实的你，不会让你更脆弱，反而会让你更自由。", "theoryNote": "本报告参考：Bowlby 依恋理论、Brené Brown 关于羞耻与防御的研究、John Gottman 伴侣冲突研究。"};
    personalities.treecat.fullReport = {"corePortrait": "你的核心剧本是「只要我足够可靠，就不会被离开」。\n\n【核心渴望】被珍惜。你希望自己的付出被看见，也希望有人愿意和你一起扛。\n【核心恐惧】被嫌弃、被抛下。你怕自己不够有趣、不够浪漫，最后被更有新鲜感的人取代。\n【防御机制】扛住一切。你把责任揽在身上，用「我来」证明自己的价值。\n【关系角色】你是关系里的定海神针，也是那个从不喊累的人。\n\n别人眼中的你：稳定、可靠、有责任感。\n真实的你：也会累，也想被照顾，只是不敢说。\n\n你不是无趣，你只是把力气都用在了「守住」上。", "originStory": "你的稳定，可能来自一个需要你「早点长大」的环境。\n\n【家庭剧本】也许你从小就承担了照顾家人的角色：懂事、让着别人、不给家里添麻烦。也许你经历过失去，所以特别珍惜拥有。你学会了一件事：只要自己够可靠，关系就不会散。\n\n【形成的信念】「我必须有用，才不会被丢下。」「情绪解决不了问题，行动才可以。」「我不能倒下。」\n\n【成年后的投射】你长成了一个很能扛的人：工作、生活、关系，你都安排得稳稳当当。你很少求助，也很少表达需要。你以为这就是爱，但对方有时会觉得，你不需要 ta。\n\n你不需要一直坚强，才值得被爱。", "attachmentStyle": "你的依恋底色是「安全型偏压抑」：你相信关系，但不太相信自己的需求会被接纳。\n\n【你的依恋雷达】你对「不稳定」和「变化」很敏感。计划总改、承诺不兑现，会让你很不安。\n\n【被触发时】你会加倍付出、默默扛，而不是表达不满。你希望对方自己发现。\n【安全时】当对方珍惜你的付出、也愿意照顾你，你会非常踏实、非常长情。\n\n【走向安全的关键】把「扛住」和「被爱」分开。你不需要一直有用，也可以说「我需要你」。", "strengthsDeep": "1. 你可靠。答应的事一定做到，是关系里最稳的那一个。\n2. 你长情。你不轻易开始，也不轻易放弃。\n3. 你有责任感。遇到问题，你不会逃，你会想办法解决。\n4. 你会照顾人。你的爱藏在日常里：热饭、修东西、记得所有小事。\n5. 你情绪稳定。你不会因为一点小事大起大落，能给对方安全感。", "blindSpots": "1. 你把「扛住」当成爱的唯一方式。你累了也不说，最后突然崩溃。\n2. 你不表达需求。你等着对方主动发现，可 ta 往往真的发现不了。\n3. 你可能显得无趣。你把精力都放在责任上，忘了经营浪漫。\n4. 你不擅长求助。你习惯一个人扛，让对方觉得自己不被需要。\n5. 你容易吸引只想享受你付出的人。你越能忍，对方越觉得你不需要回报。", "triggerPoints": "【轻度警报】对方太爱变化、计划总改\n身体信号：不安、想掌控、开始重新安排\n内心戏：这样下去不行。\n应对：说出你的不安。「计划变来变去我会有点慌，我们能提前说好吗？」\n\n【中度触发】对方不谈未来、回避承诺\n身体信号：焦虑、想问又不敢问\n内心戏：ta 是不是没打算长久？\n应对：直接问一次。「我想知道你怎么看我们的以后，不用现在回答。」\n\n【彻底爆发】对方说「你太无趣了」或否定你的付出\n身体信号：受伤、沉默、想退出\n内心戏：我做了这么多，原来一文不值。\n应对：告诉对方：「你可以对我不满，但请不要否定我的付出。」\n\n【事后修复】对自己说：「我也可以累，也可以需要人。」然后向对方提一个具体请求。", "conflictPattern": "【阶段一 · 升级】对方提出不满，你第一反应是「我来解决」。\n你的内心戏：只要我把问题修好，就没事了。\n你该做的：先听情绪，再给方案。「我先听你说，不急着解决。」\n不要做：用行动代替沟通。\n\n【阶段二 · 爆发】你扛了太久，突然爆发，把积压的委屈全说出来。\n你的内心戏：我扛了这么多，你为什么一点都没察觉？\n你该做的：平时就说，不要攒。「我最近有点累，想跟你说说。」\n不要做：一次性翻完所有旧账。\n\n【阶段三 · 僵持】你沉默、继续做事，对方觉得你在冷暴力。\n你的内心戏：我不想吵，我做点事就好了。\n你该做的：说一句「我不是不理你，我需要一点时间」。\n不要做：用沉默惩罚对方。\n\n【阶段四 · 修复】对方来和好，你说「没事」。\n你的内心戏：不想再添麻烦。\n你该做的：诚实一点。「我有点难过，但我更想和你把话说开。」\n不要做：假装什么都没发生。", "communicationGuide": "场景1｜表达需求\n❌ 默默付出等对方发现。\n✅「我为你做了 XX，不是要你回报，只是希望你知道。」\n\n场景2｜表达疲惫\n❌「我没事。」\n✅「我最近有点累，今天能让我靠一下吗？」\n\n场景3｜对方吃醋\n❌ 觉得没必要解释。\n✅「我心里只有你，你可以直接问我，不用自己猜。」\n\n场景4｜对方冷淡\n❌ 加倍付出挽回。\n✅「我感觉我们有点远，我想知道你怎么了。」\n\n场景5｜你想独处\n❌ 突然沉默。\n✅「我需要一点时间缓一缓，不是你的问题。」\n\n场景6｜谈未来\n❌ 自己规划好一切。\n✅「我想听听你想要什么，我们一起定。」\n\n场景7｜道歉\n❌ 买礼物但不说话。\n✅「昨天是我不好，我不该把情绪憋着不说。」\n\n场景8｜拒绝\n❌ 硬扛。\n✅「这件事我做不到，我不想答应了又让你失望。」\n\n【万能句】「我可以扛，但我也想有人和我一起扛。」", "scenarioPractice": "场景 A｜ta 说「你太无趣了」\n你可能会：受伤、沉默、觉得自己不够好。\n更好的做法：「我可能不太会制造惊喜，但我一直在。你告诉我，你想要什么样的有趣？」\n\n场景 B｜你累到不想动，但 ta 还在等你安排\n你可能会：硬撑。\n更好的做法：「我今天真的没力气了，我们点个外卖，一起躺着好吗？」\n\n场景 C｜ta 想辞职去旅行，你觉得不靠谱\n你可能会：直接否定、替 ta 做决定。\n更好的做法：「我担心的是现实问题，但我愿意听你的想法。我们一起算算？」", "loveTimeline": "0-1 个月｜观察期\n你在看 ta 是否值得长期投入。关键动作：别只看条件，也看相处是否舒服。\n\n2-3 个月｜规划期\n如果 ta 靠谱，你会开始把 ta 放进未来。关键动作：把你的规划说出来，别自己决定。\n\n3-6 个月｜磨合期\n你可能会发现问题，但第一反应是修复而不是离开。关键动作：也允许自己表达不满。\n\n6-12 个月｜稳定期\n你们建立起深厚的信任和默契。关键动作：别让稳定变成理所当然。\n\n1 年以后｜长期期\n你们成了彼此的家人。关键动作：继续经营，别只过日子。\n\n【最大风险】你把自己活成了工具人，然后怪对方不爱你。", "idealPartner": "【你会被谁吸引】珍惜稳定、愿意一起经营长期关系的人。ta 不需要太多惊喜，但要愿意每天在场。你容易被「温柔、踏实、懂得感恩」的人吸引。\n\n【三个雷区】\n1. 把稳定当无聊、总想折腾的人——你会累。\n2. 只享受照顾、从不回应的人——你会寒心。\n3. 一有问题就提分手的人——你会没有安全感。\n\n【三个必须】\n1. ta 必须珍惜你的付出，并且回应。\n2. ta 必须愿意一起承担，而不是只让你扛。\n3. ta 必须有长期打算，不玩短期关系。\n\n【最佳搭配】🌙 小祖宗（温柔）、☀️ 妈妈（温暖）", "partnerManual": "ta 总在守着你。请记得也守住 ta：\n\n1. 他可靠，但不代表他不需要被照顾。\n2. 他很少说累，请主动问一句。\n3. 他的爱藏在行动里，别只听得见情话。\n4. 不要说他无趣，他会记很久。\n5. 他需要你也有责任感，别只让他扛。\n6. 他沉默时，可能是在消化，不是冷暴力。\n7. 他愿意为你做很多，但请别当成理所当然。\n8. 他需要被需要，也需要被珍惜。\n9. 他其实也想要浪漫，只是不好意思说。\n10. 你主动一点，他就会松下来。", "compatibility": "高匹配：🌙 小祖宗、☀️ 妈妈、🌊 管家\n和 ta 们相处：对方温柔、稳定，能接住你的付出。\n\n需要磨合：🦋 浪子（太自由）、🎭 演员（太多变）\n和 ta 们相处：先说清楚你的节奏和底线，别用沉默表达不满。\n\n容易互相消耗：🌹 公主病（你哄不动）、🧜‍♀️ 万人迷（你抓不住）\n和 ta 们相处：别用「扛」换爱，直接说出你的需要。", "redFlags": "你习惯扛，但有些信号不该扛。3 条以上，请正视：\n1. ta 把你的付出当理所当然。\n2. ta 从不照顾你的感受。\n3. ta 说你无趣、没意思。\n4. ta 只享受稳定，不愿承担责任。\n5. ta 一有问题就提分手。\n6. ta 让你一个人扛所有事。\n7. ta 从不主动关心你。\n8. ta 让你觉得自己的需要不重要。\n9. ta 一直在索取。\n10. 你在这段关系里，一直在扛，却很少被心疼。", "growthPlan": "第 1 周｜说出来\n· 每天告诉 ta 一件你的真实感受，不只报平安。\n· 记录 3 次「我累了但没说」的时刻。\n· 说一次「我今天需要你」。\n\n第 2 周｜分担\n· 遇到问题时，先说「我们一起想办法」，不独自扛。\n· 让 ta 帮你做一件事，不纠正。\n· 接受一次照顾，不立刻回报。\n\n第 3 周｜接受变化\n· 尝试一件没有计划的小事，允许不完美。\n· 计划被改变时，先表达感受，不急着掌控。\n· 和 ta 聊一次你害怕的事。\n\n第 4 周｜照顾自己\n· 留一天只做自己想做的事。\n· 写下 3 个「我不需要有用也值得被爱」的理由。\n· 回顾：这周我有几次让别人帮我？\n\n【每周复盘】这周我扛了多少？有没有人帮我扛？", "yearPlan": "第 1-3 个月｜学会求助\n目标：每周至少一次，让别人帮你。\n\n第 4-6 个月｜表达需要\n目标：把「我没事」换成「我需要你」。\n\n第 7-9 个月｜经营浪漫\n目标：每月制造一次小惊喜，不只过日子。\n\n第 10-12 个月｜被照顾\n目标：从「我来」变成「我们一起」。", "letterToFuture": "给 6 个月后，学会被保护的你：\n\n希望你不再用「我能扛」来证明自己值得被爱。\n\n希望你遇到一个会心疼你、也愿意和你一起扛的人。\n\n你可以继续可靠，但也请允许自己累、允许自己需要人。\n\n你不需要一直坚强，才值得被爱。", "theoryNote": "本报告参考：John Gottman 伴侣冲突研究、Gary Chapman《爱的五种语言》、Sue Johnson 情绪取向疗法（EFT）。"};
    personalities.siren.fullReport = {"corePortrait": "你的核心剧本是「只要我掌握主动权，就不会被伤害」。\n\n【核心渴望】被真正看见。你希望有人喜欢的不只是你的魅力，而是真实的你。\n【核心恐惧】被动和失去价值。你怕一旦不占上风，就会被抛下。\n【防御机制】吸引和掌控。你懂得如何让人心动，也习惯在关系里占据主动。\n【关系角色】你是关系里的万人迷，也是那个最怕输的人。\n\n别人眼中的你：有魅力、会撩、永远不缺人喜欢。\n真实的你：很怕被看穿，也很怕被真正靠近。\n\n你不是在玩，你是在用魅力保护自己。", "originStory": "你的魅力，可能很早就被发现了。\n\n【家庭剧本】也许你从小就知道怎么讨人喜欢：长得好看、会说话、懂得察言观色。也许你见过被动的人被忽视、被伤害。于是你学会用吸引力换取主动权，用「被很多人喜欢」来确认自己值得。\n\n【形成的信念】「只要我占上风，就不会被伤害。」「被喜欢是有条件的。」「先动心的人会输。」\n\n【成年后的投射】你长成了一个很有魅力的人：你知道怎么让场面好看，也知道怎么让对方围着你转。但你也发现，被很多人喜欢，和被一个人真正看见，是两件事。\n\n你值得被爱，不是因为你迷人，而是因为你本身。", "attachmentStyle": "你的依恋底色是「回避型偏焦虑」：你渴望亲密，又害怕在亲密里失去掌控。\n\n【你的依恋雷达】你对「失控」极其敏感。对方不够热情、不完全听你的，你就会不舒服。\n\n【被触发时】你会用魅力重新拿回主动权：冷一点、撩一下、让对方猜。\n【安全时】当对方有自信、不被你轻易拿捏、也敢于挑战你，你反而会认真。\n\n【走向安全的关键】把「赢」和「被爱」分开。你不需要一直占上风，也可以偶尔被动、偶尔示弱。", "strengthsDeep": "1. 你很有魅力。你知道怎么让人心动，也懂得营造氛围。\n2. 你情商高。你能快速读懂对方，知道 ta 想要什么。\n3. 你自信。你敢于表达、敢于争取，不会畏畏缩缩。\n4. 你有分寸。你知道什么时候进、什么时候退。\n5. 你其实很聪明。你看得清关系里的博弈，只是常常用来保护自己。", "blindSpots": "1. 你用魅力换安全感。你享受被喜欢，却不敢真正交心。\n2. 你习惯掌控。对方一旦不完全听你的，你就想拿回主动权。\n3. 你可能显得不认真。对方会觉得你只是在玩。\n4. 你不容易示弱。你怕一旦被动，就会失去价值。\n5. 你可能错过真正懂你的人。因为 ta 还没走近，你就先赢了。", "triggerPoints": "【轻度警报】对方不够热情、回应变慢\n身体信号：不舒服、想重新吸引注意\n内心戏：主动权在流失。\n应对：先别急着撩，问问自己「我是想要 ta，还是想要赢？」\n\n【中度触发】对方太独立、不完全听你的\n身体信号：烦躁、想挑战、想拿回主导\n内心戏：我不能被牵着走。\n应对：把「赢」换成「了解」。「你为什么这么想？我想听听。」\n\n【彻底爆发】对方看穿你的套路、说「你只是在玩」\n身体信号：被戳中、愤怒、想反驳\n内心戏：你根本不懂我。\n应对：先承认一点。「我确实习惯保护自己，但我不是不在乎。」\n\n【事后修复】告诉对方：「我刚才用了一点套路，是因为我怕认真了会输。」", "conflictPattern": "【阶段一 · 升级】你感到失控，开始用冷淡或魅力重新拿回主动。\n你的内心戏：我不能让他觉得吃定我了。\n你该做的：说出真实感受。「我有点不安，但我不想用套路对你。」\n不要做：故意冷落、刺激对方。\n\n【阶段二 · 爆发】对方不吃这套，你更想赢，开始说狠话。\n你的内心戏：那就看谁先低头。\n你该做的：停下来，问自己「我想赢，还是想好好在一起？」\n不要做：用别人刺激对方。\n\n【阶段三 · 僵持】你们比谁更冷，关系降温。\n你的内心戏：先低头就输了。\n你该做的：先递台阶。「我不想赢了，我想解决问题。」\n不要做：等对方来追你。\n\n【阶段四 · 修复】你想和好，但不想显得太主动。\n你的内心戏：我不能掉价。\n你该做的：直接说「我想和好」，不玩套路。\n不要做：用暧昧让对方猜。", "communicationGuide": "场景1｜表达需求\n❌ 用套路让对方猜。\n✅「我希望我们这样，你觉得呢？」\n\n场景2｜表达在意\n❌ 用冷淡掩饰。\n✅「我其实很在意你，只是我不太习惯说。」\n\n场景3｜发生冲突\n❌ 冷战、比谁先低头。\n✅「我不想赢这场架，我想解决问题。」\n\n场景4｜对方吃醋\n❌ 享受被争抢。\n✅「我在意你的感受，我会注意边界。」\n\n场景5｜对方冷淡\n❌ 用别人刺激 ta。\n✅「你最近有点远，我不想玩猜心，我想知道真实想法。」\n\n场景6｜谈未来\n❌ 保持暧昧、留后路。\n✅「我想认真和你聊聊以后，你愿意吗？」\n\n场景7｜道歉\n❌ 用魅力化解。\n✅「我刚才用套路了，对不起，我想认真对你。」\n\n场景8｜拒绝\n❌ 吊着对方。\n✅「我很感谢你的喜欢，但我不想给你错误的期待。」\n\n【万能句】「我不想赢了，我想被你真正看见。」", "scenarioPractice": "场景 A｜ta 没有像别人那样追你\n你可能会：不舒服，想用魅力把 ta 拉回来。\n更好的做法：问自己「我是喜欢 ta，还是喜欢被追？」然后直接表达兴趣。\n\n场景 B｜ta 说「我觉得你不够真实」\n你可能会：立刻防御、演得更完美。\n更好的做法：「你说得对，我习惯保护自己。给我一点时间。」\n\n场景 C｜你发现自己在同时和多个人暧昧\n你可能会：享受被喜欢，不想做选择。\n更好的做法：问自己「我是在选择，还是在逃避认真？」然后做一个决定。", "loveTimeline": "0-1 个月｜吸引期\n你展现最大魅力，ta 迅速被你吸引。关键动作：早一点露出真实，别只靠魅力。\n\n2-3 个月｜测试期\n你开始试探 ta 是否值得你认真。关键动作：少一点套路，多一点直接。\n\n3-6 个月｜博弈期\n如果 ta 不吃套路，你可能会不安，甚至想撤退。关键动作：把「赢」放下。\n\n6-12 个月｜信任期\n你学会放下一点掌控，关系才真正亲密。关键动作：允许自己被动一次。\n\n1 年以后｜长期期\n你终于可以在一个人面前不完美。关键动作：珍惜那个看见真实你的人。\n\n【最大风险】你赢了每一场博弈，却输掉了真正的亲密。", "idealPartner": "【你会被谁吸引】有自信、不被你轻易拿捏、也敢于挑战你的人。ta 不能太弱，也不能太强势，你们需要势均力敌。你容易被「聪明、有主见、稳」的人吸引。\n\n【三个雷区】\n1. 太容易被你掌控、没有自我的人——你会很快失去兴趣。\n2. 控制欲比你还强的人——你们会互相消耗。\n3. 只看外表、不了解真实的你的人——你会孤独。\n\n【三个必须】\n1. ta 必须有自信，不被你的魅力牵着走。\n2. ta 必须看得见真实的你，而不只是外表。\n3. ta 必须愿意和你平等相处，不玩博弈。\n\n【最佳搭配】🏔️ 军师（理性独立）、🎭 演员（同样有魅力）", "partnerManual": "ta 看起来什么都不缺。这份说明告诉你 ta 缺什么：\n\n1. 她很有魅力，但她更需要被真正看见。\n2. 不要只夸她好看，也夸她的内在。\n3. 她试探你时，别急着追，稳定一点。\n4. 她习惯掌控，请给她平等的空间。\n5. 她示弱的时候，请认真接住。\n6. 不要和她玩博弈，她会比你更会。\n7. 她需要你有自己的世界，不要围着她转。\n8. 她其实很怕被抛弃，只是不说。\n9. 她认真的时候，请一定当真。\n10. 你越真实，她越不需要演。", "compatibility": "高匹配：🏔️ 军师、🎭 演员、🦋 浪子\n和 ta 们相处：对方独立、有魅力，你们势均力敌。\n\n需要磨合：🌳 保镖（太稳让你无聊）、☀️ 妈妈（太付出让你有压力）\n和 ta 们相处：别用套路测试对方，直接说需求。\n\n容易互相消耗：🌹 公主病（都要赢）、🔥 仆人（你退 ta 追）\n和 ta 们相处：约定「不玩猜心」，谁想要什么直接说。", "redFlags": "你值得被认真对待。下面命中 3 条以上，别再自我说服：\n1. ta 只喜欢你的外表。\n2. ta 想控制你的一切。\n3. ta 和你玩博弈、比谁更冷。\n4. ta 从不认真听你说话。\n5. ta 让你觉得必须一直完美。\n6. ta 只在你迷人时热情。\n7. ta 不尊重你的边界。\n8. ta 让你越来越不真实。\n9. ta 从不谈未来。\n10. 你在这段关系里，一直在赢，却从未被看见。", "growthPlan": "第 1 周｜觉察套路\n· 记录你每次想「拿捏」对方的瞬间。\n· 记录 3 次「我其实想认真，但用了套路」的时刻。\n· 每天问自己一次：「我是想赢，还是想靠近？」\n\n第 2 周｜直接表达\n· 把暗示换成一句明确的「我想要……」\n· 说一次「我其实很在意你」，不用套路。\n· 对方冷淡时，直接问，不用别人刺激 ta。\n\n第 3 周｜允许被动\n· 让 ta 安排一次约会，你只负责享受。\n· 接受一次不被追捧，看看自己能不能稳住。\n· 练习说「我不知道」。\n\n第 4 周｜展现脆弱\n· 告诉 ta 一件你其实很怕的事。\n· 认真道歉一次，不用魅力化解。\n· 回顾：这周我有几次放下了掌控？\n\n【每周复盘】这周我赢了几次？我靠近了几次？", "yearPlan": "第 1-3 个月｜减少套路\n目标：每次想拿捏对方时，先直接说需求。\n\n第 4-6 个月｜练习真实\n目标：让一个人看到你不完美的一面。\n\n第 7-9 个月｜平等相处\n目标：从「谁占上风」变成「我们怎么一起好」。\n\n第 10-12 个月｜被看见\n目标：从「被很多人喜欢」到「被一个人真正看见」。", "letterToFuture": "给 6 个月后，不再靠被喜欢确认价值的你：\n\n希望你不再用魅力来换安全感。\n\n希望你遇到一个人，ta 见过你不完美的样子，还愿意留下。\n\n你可以继续迷人，但也请允许自己真实、被动、需要人。\n\n真正的魅力，不是让所有人都喜欢你，而是让一个人看见真实的你。", "theoryNote": "本报告参考：Bowlby 依恋理论、John Gottman 伴侣冲突研究、Brené Brown 关于价值感与脆弱的研究。"};

    // ========== 状态管理 ==========
    var currentQuestion = 0;
    var answers = [];
    var currentResultKey = '';

    // ========== 核心逻辑 ==========
    function startTest() {
      document.getElementById('welcomePage').style.display = 'none';
      document.getElementById('testPage').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      var q = questions[currentQuestion];
      document.getElementById('questionNum').textContent = '第' + (currentQuestion + 1) + '题';
      document.getElementById('questionTag').textContent = (dimTags[currentQuestion] || '') + (q.multi ? ' · 可多选（最多2项）' : '');
      document.getElementById('questionText').textContent = q.q;
      document.getElementById('progressNum').textContent = currentQuestion + 1;
      document.getElementById('progressFill').style.width = ((currentQuestion + 1) * 5) + '%';

      var container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach(function(opt, idx) {
        var btn = document.createElement('button');
        var sel = answers[currentQuestion] || [];
        btn.className = 'option-btn' + (sel.indexOf(idx) >= 0 ? ' selected' : '');
        btn.textContent = opt.text;
        btn.onclick = (function(i) { return function() { selectOption(i); }; })(idx);
        container.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').textContent = currentQuestion === 19 ? '查看结果' : '下一题';
    }

    function selectOption(idx) {
      var q = questions[currentQuestion];
      if (q.multi) {
        var arr = answers[currentQuestion] || [];
        var isAll = !!(q.options[idx] && q.options[idx].all);
        var pos = arr.indexOf(idx);
        if (pos >= 0) {
          arr.splice(pos, 1);
        } else if (isAll) {
          arr = [idx];
        } else {
          arr = arr.filter(function(i) { return !(q.options[i] && q.options[i].all); });
          if (arr.length >= 2) {
            alert('最多选2项哦～');
            return;
          }
          arr.push(idx);
        }
        answers[currentQuestion] = arr;
      } else {
        answers[currentQuestion] = [idx];
      }
      var sel = answers[currentQuestion] || [];
      var btns = document.querySelectorAll('.option-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('selected', sel.indexOf(i) >= 0);
      }
    }

    function nextQuestion() {
      var sel = answers[currentQuestion];
      if (!sel || sel.length === 0) {
        alert(questions[currentQuestion].multi ? '至少选一项哦～' : '请先选择一个选项哦～');
        return;
      }
      if (currentQuestion < 19) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function addOptionScores(qIdx, idx, scores) {
      var q = questions[qIdx];
      var opt = q.options[idx];
      if (!opt) return;
      if (opt.all) {
        var sum = {}, n = 0;
        for (var oi = 0; oi < q.options.length; oi++) {
          var o = q.options[oi];
          if (o.all) continue;
          n++;
          for (var k in o.scores) { if (o.scores.hasOwnProperty(k)) sum[k] = (sum[k] || 0) + o.scores[k]; }
        }
        if (!n) return;
        for (var key in sum) { if (sum.hasOwnProperty(key)) scores[key] += sum[key] / n; }
        return;
      }
      var weight = q.multi ? 0.5 : 1;
      for (var sk in opt.scores) { if (opt.scores.hasOwnProperty(sk)) scores[sk] += opt.scores[sk] * weight; }
    }

    function calculateResult() {
      var scores = { E: 0, I: 0, N: 0, S: 0, F: 0, T: 0, J: 0, P: 0, A: 0, C: 0 };

      for (var qIdx = 0; qIdx < answers.length; qIdx++) {
        var sel = answers[qIdx];
        if (!sel || sel.length === 0) continue;
        for (var si = 0; si < sel.length; si++) {
          addOptionScores(qIdx, sel[si], scores);
        }
      }

      var energy = scores.E >= scores.I ? 'E' : 'I';
      var info = scores.N >= scores.S ? 'N' : 'S';
      var decision = scores.F >= scores.T ? 'F' : 'T';
      var lifestyle = scores.J >= scores.P ? 'J' : 'P';
      var attach = scores.A > scores.C ? 'A' : 'S';

      var combo = energy + info + decision + lifestyle + attach;

      var map = {
        'ETSJS': 'butterfly', 'ETFJP': 'butterfly', 'ETFJS': 'flame',
        'EFSJP': 'sunflower', 'EFFJP': 'sunflower', 'EFSJS': 'flame',
        'IFSJS': 'whale', 'IFTJS': 'whale', 'IFFJS': 'moon',
        'IEFJS': 'moon', 'ISAJP': 'rose', 'ITAJP': 'rose',
        'IFAJS': 'moon', 'EFAJP': 'rose', 'ENSJP': 'siren',
        'ENTJP': 'eagle', 'NFPJP': 'fox', 'SFFJP': 'sakura',
        'SFTJP': 'clownfish', 'SJSJS': 'treecat'
      };

      if (map[combo]) return map[combo];

      if (energy === 'E' && decision === 'T' && attach === 'S') return 'butterfly';
      if (energy === 'E' && decision === 'F' && attach === 'S') return 'flame';
      if (energy === 'I' && decision === 'F' && attach === 'A') return 'moon';
      if (energy === 'I' && decision === 'T' && attach === 'S') return 'whale';
      if (decision === 'F' && attach === 'S' && lifestyle === 'P') return 'sunflower';
      if (energy === 'I' && attach === 'A') return 'rose';
      if (info === 'N' && lifestyle === 'P') return 'fox';
      if (decision === 'T' && lifestyle === 'J') return 'eagle';
      if (info === 'S' && decision === 'F') return 'sakura';
      if (info === 'S' && decision === 'T' && lifestyle === 'P') return 'clownfish';
      if (lifestyle === 'J' && attach === 'S') return 'treecat';
      if (energy === 'E' && info === 'N') return 'siren';

      return 'butterfly';
    }

    function showResult() {
      currentResultKey = calculateResult();
      var p = personalities[currentResultKey];

      document.getElementById('testPage').style.display = 'none';
      var rp = document.getElementById('resultPage');
      rp.style.display = 'block';

      var scores = { E: 0, I: 0, N: 0, S: 0, F: 0, T: 0, J: 0, P: 0, A: 0, C: 0 };
      for (var qIdx = 0; qIdx < answers.length; qIdx++) {
        var sel = answers[qIdx];
        if (!sel || sel.length === 0) continue;
        for (var si = 0; si < sel.length; si++) {
          addOptionScores(qIdx, sel[si], scores);
        }
      }
      var dims = [
        { left: '外向 E', right: '内向 I', lv: scores.E, rv: scores.I, color: '#E8A0BF', dimName: '能量方向' },
        { left: '直觉 N', right: '感觉 S', lv: scores.N, rv: scores.S, color: '#9B8DC7', dimName: '信息处理' },
        { left: '感性 F', right: '理性 T', lv: scores.F, rv: scores.T, color: '#FF6B6B', dimName: '决策方式' },
        { left: '计划 J', right: '灵活 P', lv: scores.J, rv: scores.P, color: '#4682B4', dimName: '生活方式' },
        { left: '焦虑 A', right: '安全 S', lv: scores.A, rv: scores.C, color: '#FFB347', dimName: '依恋风格' }
      ];

      var dimsHTML = '';
      for (var d = 0; d < dims.length; d++) {
        var dim = dims[d];
        var total = dim.lv + dim.rv || 1;
        var lp = Math.round(dim.lv / total * 100);
        var rp2 = 100 - lp;
        dimsHTML += '<div class="dim-item">' +
          '<div class="dim-header"><span class="left">' + dim.left + ' <span class="pct">' + lp + '%</span></span>' +
          '<span class="right"><span class="pct">' + rp2 + '%</span> ' + dim.right + '</span></div>' +
          '<div class="dim-bar-bg"><div class="dim-bar-fill" style="width:' + lp + '%;background:' + dim.color + '"></div></div>' +
          '<div class="dim-name">' + dim.dimName + '</div></div>';
      }

      rp.innerHTML =
        '<div class="result-hero" style="background:linear-gradient(135deg,' + p.colorLight + ',' + p.color + '22)">' +
          '<div class="result-emoji">' + p.emoji + '</div>' +
          '<div class="result-label">你的恋爱人格是</div>' +
          '<div class="result-type" style="color:' + p.color + '">' + p.name + '</div>' +
          '<div class="result-keywords">' + p.keywords + '</div>' +
        '</div>' +
        '<div class="dimension-section"><h3><span class="icon" style="background:#F3EDF0">📊</span> 五维分析</h3>' + dimsHTML + '</div>' +
        '<div class="result-card"><h3><span class="icon" style="background:#FFF0F5">💗</span> 恋爱画像</h3><p>' + p.description + '</p></div>' +
        '<div class="result-card"><h3><span class="icon" style="background:#F0FFF0">✅</span> 恋爱优势</h3>' +
          '<ul class="trait-list strengths">' + p.strengths.map(function(s){return '<li><span class="dot">●</span>' + s + '</li>';}).join('') + '</ul></div>' +
        '<div class="result-card"><h3><span class="icon" style="background:#FFF8F0">⚠️</span> 恋爱盲点</h3>' +
          '<ul class="trait-list weaknesses">' + p.weaknesses.map(function(w){return '<li><span class="dot">●</span>' + w + '</li>';}).join('') + '</ul></div>' +
        '<div class="match-card"><h3>💕 适合你的对象</h3><p>' + p.match + '</p></div>' +
        '<div class="growth-card"><h3>🌱 恋爱成长建议</h3><p>' + p.growth + '</p></div>' +
        '<div class="pay-section" id="paySection">' +
          '<h3>🔓 解锁完整深度报告</h3>' +
          '<p class="desc">更详细的自我分析，帮你理解感情中的深层模式</p>' +
          '<ul class="pay-features">' +
            '<li>人格内核 + 童年情感模式</li>' +
            '<li>依恋类型深度解析</li>' +
            '<li>5 个高光时刻 + 5 个隐形代价</li>' +
            '<li>触发点分级 + 冲突全流程</li>' +
            '<li>8 场景话术库 + 场景演练</li>' +
            '<li>恋爱时间线 + 理想伴侣 + 伴侣说明书</li>' +
            '<li>12 型兼容性 + 10 条红旗自查</li>' +
            '<li>30 天计划 + 12 个月路线 + 一封信</li>' +
          '</ul>' +
          '<div class="original-price">原价 ¥39.9</div>' +
          '<div class="price">¥19.9</div>' +
          '<div class="price-unit">限时特惠</div><br>' +
          '<button class="pay-btn" onclick="handlePay()">立即解锁 →</button>' +
        '</div>' +
        '<div class="full-report-section" id="fullReport"><h3>🔓 完整深度报告</h3><div id="reportSections"></div></div>' +
        '<div class="action-buttons">' +
          '<button class="action-btn" onclick="showShareModal()">📤 分享给朋友</button>' +
          '<button class="action-btn" onclick="restartTest()">🔄 重新测试</button>' +
        '</div>' +
        '<div class="footer">由「心屿」性格测试提供</div>';

      window.scrollTo(0, 0);
    }

    function handlePay() {
      document.getElementById('passwordModal').classList.add('show');
      document.getElementById('passwordInput').value = '';
      document.getElementById('passwordError').classList.remove('show');
    }
    function closePasswordModal() { document.getElementById('passwordModal').classList.remove('show'); }
    function verifyPassword() {
      var input = document.getElementById('passwordInput').value.trim();
      var passwordMap = {
        butterfly: 'LOVE24BTY', flame: 'LOVE24LYN', moon: 'LOVE24YGL',
        whale: 'LOVE24SHJ', sunflower: 'LOVE24XRK', rose: 'LOVE24DGMG',
        fox: 'LOVE24QMH', eagle: 'LOVE24XSY', sakura: 'LOVE24YHM',
        clownfish: 'LOVE24XCY', treecat: 'LOVE24GSM', siren: 'LOVE24HY'
      };
      if (input === passwordMap[currentResultKey]) {
        document.getElementById('passwordModal').classList.remove('show');
        document.getElementById('paySection').style.display = 'none';
        showFullReport();
      } else {
        document.getElementById('passwordError').classList.add('show');
      }
    }
    var reportSections = [
      ['🎭', '人格内核 · 你的核心剧本', 'corePortrait'],
      ['🧸', '人格形成 · 童年情感模式', 'originStory'],
      ['🫧', '依恋类型深度解析', 'attachmentStyle'],
      ['✨', '你在爱里的 5 个高光时刻', 'strengthsDeep'],
      ['🕳', '你在爱里的 5 个隐形代价', 'blindSpots'],
      ['⚡', '情绪触发点分级手册', 'triggerPoints'],
      ['🌪', '冲突全流程 · 4 个阶段', 'conflictPattern'],
      ['💬', '沟通话术库 · 8 个高频场景', 'communicationGuide'],
      ['🎬', '场景演练 · 换一种做法', 'scenarioPractice'],
      ['⏳', '恋爱时间线 · 5 个阶段', 'loveTimeline'],
      ['💕', '理想伴侣画像', 'idealPartner'],
      ['📘', '给伴侣的使用说明书', 'partnerManual'],
      ['🧩', '12 型兼容性地图', 'compatibility'],
      ['🚩', '危险信号清单 · 10 条红旗', 'redFlags'],
      ['🌱', '30 天成长计划', 'growthPlan'],
      ['🗺', '12 个月成长路线', 'yearPlan'],
      ['💌', '写给 6 个月后的你', 'letterToFuture']
    ];
    function showFullReport() {
      var r = personalities[currentResultKey].fullReport;
      var html = '';
      for (var i = 0; i < reportSections.length; i++) {
        var sec = reportSections[i];
        var num = (i + 1 < 10 ? '0' : '') + (i + 1);
        html += '<div class="section-block"><div class="section-title"><span class="section-num">' + num + '</span>' + sec[0] + ' ' + sec[1] + '</div><div class="section-content">' + (r[sec[2]] || '').replace(/</g, '&lt;') + '</div></div>';
      }
      html += '<div class="report-theory"><div class="theory-title">📚 理论参考</div><div class="theory-body">' + (r.theoryNote || '') + '</div><div class="theory-note">以上理论仅作框架参考，报告文字均为原创通俗化写作，不复述原书内容。本报告为心理学科普内容，不替代专业心理咨询或诊断。</div></div>';
      document.getElementById('reportSections').innerHTML = html;
      document.getElementById('fullReport').classList.add('show');
      document.getElementById('fullReport').scrollIntoView({ behavior: 'smooth' });
    }

    function showShareModal() { document.getElementById('shareModal').classList.add('show'); }
    function closeShareModal() { document.getElementById('shareModal').classList.remove('show'); }
    function shareTo(platform) {
      if (platform === 'copy') {
        navigator.clipboard.writeText(window.location.href).then(function() { alert('链接已复制，快去分享给朋友吧！'); });
      } else if (platform === 'wechat') {
        alert('请使用微信右上角「...」分享给朋友');
      } else {
        alert('请保存图片或复制链接分享到朋友圈');
      }
      closeShareModal();
    }
    function restartTest() {
      currentQuestion = 0;
      answers = [];
      document.getElementById('resultPage').style.display = 'none';
      document.getElementById('welcomePage').style.display = 'block';
      window.scrollTo(0, 0);
    }
  </script>
