<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>你的恋爱人格 | 20道题深度测试</title>
  <meta name="description" content="20道深度测试题，12种恋爱人格，全面解析你在感情中的真实模样">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #E8A0BF;
      --primary-dark: #C97BA0;
      --accent: #9B8DC7;
      --bg: #FEFBF6;
      --text: #2D2D2D;
      --text-light: #777;
      --card-bg: #FFFFFF;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
      --radius: 20px;
      --radius-sm: 12px;
      --radius-xs: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      background-image: radial-gradient(circle at 20% 20%, rgba(232,160,191,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(155,141,199,0.06) 0%, transparent 50%);
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 16px;
      min-height: 100vh;
    }

    /* ========== 欢迎页 ========== */
    .welcome-page {
      text-align: center;
      padding: 48px 20px 32px;
      animation: fadeUp 0.8s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart-icon {
      font-size: 56px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }

    .welcome-title {
      font-size: 30px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 32px;
      letter-spacing: 1px;
    }

    .stats-row {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 32px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      margin: 0 8px 32px;
    }

    .stat-item {
      flex: 1;
      padding: 20px 12px;
      text-align: center;
      position: relative;
    }
    .stat-item:not(:last-child)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 20%;
      height: 60%;
      width: 1px;
      background: #f0e8ee;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 2px;
    }

    .types-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 32px;
      padding: 0 4px;
    }

    .type-pill {
      background: var(--card-bg);
      padding: 12px 8px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
      cursor: default;
      border: 1px solid rgba(232,160,191,0.1);
    }
    .type-pill:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }
    .type-pill .emoji { font-size: 20px; display: block; margin-bottom: 4px; }
    .type-pill .name { font-weight: 600; color: var(--text); font-size: 11px; }

    .start-btn {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 18px 56px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 24px rgba(232,160,191,0.35);
      letter-spacing: 2px;
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(232,160,191,0.45);
    }
    .start-btn:active {
      transform: translateY(0);
    }

    /* ========== 测试页 ========== */
    .test-page { display: none; animation: fadeUp 0.4s ease; }

    .progress-wrapper {
      margin-bottom: 20px;
    }
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
    }
    .progress-count {
      font-size: 12px;
      color: var(--text-light);
    }
    .progress-bar {
      background: #F3EDF0;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      height: 100%;
      border-radius: 4px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .question-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 22px;
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
    }
    .question-tag {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .question-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 22px;
      color: var(--text);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      background: #FAFAFA;
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s ease;
      line-height: 1.5;
      color: var(--text);
    }
    .option-btn:hover {
      border-color: var(--primary);
      background: #FFF8FA;
      transform: translateX(4px);
    }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, #FFF5F8, #F8F0FF);
      box-shadow: 0 2px 8px rgba(232,160,191,0.15);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .nav-btn {
      flex: 1;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .nav-btn.prev {
      background: #F5F5F5;
      color: var(--text-light);
    }
    .nav-btn.prev:hover { background: #EEE; }
    .nav-btn.next {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      box-shadow: 0 4px 16px rgba(232,160,191,0.3);
    }
    .nav-btn.next:hover {
      box-shadow: 0 6px 20px rgba(232,160,191,0.4);
      transform: translateY(-1px);
    }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    /* ========== 结果页 ========== */
    .result-page { display: none; animation: fadeUp 0.6s ease; }

    .result-hero {
      text-align: center;
      padding: 40px 20px 32px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .result-hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      animation: shimmer 8s linear infinite;
    }
    @keyframes shimmer {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-emoji {
      font-size: 72px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
      position: relative;
    }
    .result-label {
      font-size: 13px;
      color: rgba(0,0,0,0.5);
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .result-type {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      position: relative;
    }
    .result-keywords {
      font-size: 14px;
      opacity: 0.8;
      letter-spacing: 2px;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 12px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .result-card h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-card h3 .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .result-card p {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.8;
    }

    .trait-list { list-style: none; }
    .trait-list li {
      font-size: 14px;
      padding: 8px 0;
      color: var(--text-light);
      line-height: 1.6;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .trait-list li::before { display: none; }
    .strengths li .dot { color: #4CAF50; flex-shrink: 0; }
    .weaknesses li .dot { color: #FF9800; flex-shrink: 0; }

    .match-card {
      background: linear-gradient(135deg, #FFF5F8, #F5F0FF);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      border: 1px solid rgba(232,160,191,0.15);
    }
    .match-card h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .match-card p { font-size: 14px; color: var(--text-light); line-height: 1.8; }

    .growth-card {
      background: linear-gradient(135deg, #F0FFF8, #F8FFF5);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      border: 1px solid rgba(76,175,80,0.1);
    }
    .growth-card h3 { font-size: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .growth-card p { font-size: 14px; color: var(--text-light); line-height: 1.8; }

    /* 维度分析 */
    .dimension-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
    }
    .dimension-section > h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dim-item { margin-bottom: 16px; }
    .dim-item:last-child { margin-bottom: 0; }
    .dim-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .dim-header .left { color: var(--text); }
    .dim-header .right { color: var(--text-light); }
    .dim-header .pct { font-weight: 700; }
    .dim-bar-bg {
      background: #F3EDF0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }
    .dim-bar-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .dim-bar-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
    }
    .dim-name {
      font-size: 11px;
      color: var(--text-light);
      text-align: center;
      margin-top: 3px;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
      margin-bottom: 16px;
    }
    .action-btn {
      padding: 16px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
    }
    .action-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .action-btn:active { transform: scale(0.98); }

    /* ========== 付费区 ========== */
    .pay-section {
      background: linear-gradient(135deg, #FFF8FA, #F8F0FF);
      border: 2px solid rgba(232,160,191,0.2);
      border-radius: var(--radius);
      padding: 28px 22px;
      text-align: center;
      margin-bottom: 12px;
    }
    .pay-section h3 {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .pay-section .desc {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 16px;
    }
    .pay-features { text-align: left; margin-bottom: 20px; }
    .pay-features li {
      font-size: 14px;
      padding: 6px 0;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }
    .pay-features li::before { content: ""; display: inline-block; width: 6px; height: 6px; background: var(--primary); border-radius: 50%; flex-shrink: 0; }
    .price {
      font-size: 36px;
      font-weight: 800;
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .price-unit { font-size: 13px; color: var(--text-light); }
    .original-price {
      text-decoration: line-through;
      color: #ccc;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .pay-btn {
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255,107,107,0.3);
      transition: all 0.3s ease;
    }
    .pay-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255,107,107,0.4);
    }

    /* ========== 完整报告 ========== */
    .full-report-section {
      display: none;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-lg);
      background: linear-gradient(135deg, #FFFBF5, #FFF8FA);
      border: 2px solid rgba(232,160,191,0.2);
    }
    .full-report-section.show {
      display: block;
      animation: fadeUp 0.6s ease;
    }
    .full-report-section > h3 {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(232,160,191,0.3);
      text-align: center;
    }
    .full-report-section .section-block {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .full-report-section .section-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .report-theory {
      margin-top: 20px; padding: 16px 18px; border-radius: 14px;
      background: rgba(255,255,255,0.72); border: 1px dashed rgba(0,0,0,0.08);
    }
    .report-theory .theory-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
    .report-theory .theory-body { font-size: 12px; line-height: 1.9; color: #6b6475; }
    .report-theory .theory-note { font-size: 11px; color: #9a94a4; margin-top: 8px; }
    .full-report-section .section-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 1px;
    }
    .full-report-section .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .full-report-section .section-content {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.9;
      white-space: pre-line;
    }

    /* ========== 弹窗 ========== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      animation: modalIn 0.3s ease;
      box-shadow: var(--shadow-lg);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-box h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--primary-dark), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal-box .pay-info {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .wechat-box {
      background: linear-gradient(135deg, #FFF5F8, #F8F0FF);
      border: 2px dashed rgba(232,160,191,0.4);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 16px;
    }
    .wechat-box .label {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 6px;
    }
    .wechat-box .id {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: 2px;
    }
    .pw-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pw-input-row input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #eee;
      border-radius: var(--radius-sm);
      font-size: 16px;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .pw-input-row input:focus { border-color: var(--primary); }
    .pw-input-row button {
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pw-input-row button:hover { opacity: 0.9; }
    .pw-error {
      color: #FF6B6B;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }
    .pw-error.show { display: block; }

    .share-options {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
    }
    .share-opt { text-align: center; cursor: pointer; }
    .share-opt .icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 6px;
      color: white;
      transition: transform 0.2s;
    }
    .share-opt:hover .icon { transform: scale(1.1); }
    .share-opt:nth-child(1) .icon { background: linear-gradient(135deg, #07C160, #06AD56); }
    .share-opt:nth-child(2) .icon { background: linear-gradient(135deg, var(--primary), var(--accent)); }
    .share-opt:nth-child(3) .icon { background: linear-gradient(135deg, #FF6B6B, #FF8E53); }
    .share-opt span { font-size: 11px; color: var(--text-light); }
    .modal-close {
      background: #F5F5F5;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      color: var(--text-light);
      cursor: pointer;
      padding: 10px 28px;
      transition: all 0.2s;
    }
    .modal-close:hover { background: #EEE; }

    .footer {
      text-align: center;
      padding: 24px 16px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>

    personalities.butterfly.fullReport = {"corePortrait": "你的核心剧本是「靠近之前，先确保自己能随时离开」。\n\n【核心渴望】被理解，但不被占有。你希望有人懂你的自由，而不是把爱变成一间上锁的房间。\n【核心恐惧】失去自我。你怕的不是孤独，而是某天醒来发现生活里只剩下「我们」，再也没有「我」。\n【防御机制】提前撤退。关系一旦升温，你就开始挑毛病、找借口、留后路，用「我本来就不适合恋爱」来保护自己。\n【关系角色】你是那个永远留着一扇门的人。门开着，你才敢留下。\n\n别人眼中的你：酷、洒脱、不好拿捏，好像什么都不缺。\n真实的你：很怕被困住，也很怕真的一个人。你不是不需要爱，你只是需要一个不会把爱变成束缚的人。\n\n你最大的矛盾在于：你渴望有人走近，却又在对方走近时后退。你测试的不是对方，而是「我还能不能做自己」。", "originStory": "你的独立，很可能是被训练出来的。\n\n【家庭剧本】也许你从小就习惯了「自己的事情自己解决」：哭了没人哄，难过了自己消化，想要什么也不敢开口。久而久之，你得出一个结论——依赖别人是危险的，只有自己最可靠。也可能你见过一段不健康的关系：一方付出全部，最后被辜负。你暗暗发誓，绝不要成为那个人。\n\n【形成的信念】「我不能麻烦别人。」「只要我不需要任何人，就不会被伤害。」「爱会让人失去自由。」\n\n【成年后的投射】你长成了一个「看起来很酷」的大人：不麻烦别人，不轻易示弱，不把任何人放进生活的核心。可每当有人真的对你好，你又会慌——因为你不知道该怎么接受，也不知道这份好能持续多久。\n\n那份独立底下，藏着一个没被好好照顾过的小孩。你不是天生冷淡，你只是学会了先保护自己。", "attachmentStyle": "你的依恋底色是「回避型偏安全」：你相信自己是好的，但不太相信关系能一直稳定。\n\n【你的依恋雷达】你对「被控制」极其敏感。对方一句「你在哪」，你可能听到的是「你要向我汇报」；对方一次情绪化，你可能解读成「这段关系要变成负担了」。\n\n【被触发时】你会拉开距离：回消息变慢、取消计划、突然需要「一个人静静」。这不是算计，是本能。\n【安全时】当对方有自己的生活、不查岗、不把情绪全压在你身上，你反而会主动靠近，甚至比谁都黏。\n\n【走向安全的关键】把「我需要空间」和「我不爱你」分开。你需要空间，这没问题；但你需要用语言说出来，而不是用消失来表达。每一次你说清楚，关系就多一分信任；每一次你消失，对方就多一分不安。", "strengthsDeep": "1. 你不黏人，也不控制。你能让伴侣保留自己的朋友、爱好和节奏，这在亲密关系里非常稀缺。和你在一起，对方不用交出自己。\n2. 你情绪稳定。对方崩溃时，你不会跟着一起乱，你能给出冷静的判断和实际的帮助。\n3. 你有边界感。你知道什么能接受、什么不能，不会为了留住一个人一再退让。你的底线清晰，反而让人安心。\n4. 你很有趣。你有自己的世界，旅行、朋友、爱好，和你在一起不会无聊。你能带给对方新的视角。\n5. 你不记仇。冲突过后，你更愿意翻篇，而不是反复翻旧账。你不喜欢把关系变成审判庭。", "blindSpots": "1. 你的「冷静」经常被读成「不在乎」。对方要的是回应，你给的是沉默，误会就这样长出来。\n2. 你用自由当挡箭牌。每次想认真，你就先找对方的缺点，好让自己有理由撤退。你保护了自己，也错过了可能。\n3. 你不擅长示弱。你习惯自己扛，结果对方永远走不进你真正的世界，最后两个人都觉得孤独。\n4. 你会突然消失。不是不爱，是不知道怎么处理情绪，但对方只看到「你走了」。一次两次可以解释，次数多了就是伤害。\n5. 你可能错过值得深耕的人。因为你在关系还没开始变好之前，就先离开了。你以为是及时止损，其实是不敢赌。", "triggerPoints": "【轻度警报】对方开始频繁问「你在哪」「和谁在一起」\n身体信号：胸口发闷、想放下手机、回复变慢\n内心戏：ta 是不是要开始管我了？\n应对：先说明，再给时间。「我需要一点自己的空间，晚点我主动找你。」\n\n【中度触发】对方要求你减少朋友聚会、查看手机、随时报备\n身体信号：烦躁、想反驳、开始找借口不见面\n内心戏：这段关系要吞掉我了。\n应对：不消失，直接谈边界。「我愿意让你安心，但我也需要保留自己的朋友和生活。」\n\n【彻底爆发】对方说「你根本不需要我」，或用分手威胁你\n身体信号：心一沉、立刻想转身、开始说狠话\n内心戏：果然，靠近就会受伤。\n应对：先停 24 小时，不做决定。告诉自己：「我现在想逃，是因为害怕，不是因为不爱。」\n\n【事后修复】冷静后补一句：「我刚才走开，不是不在乎你，是我不知道怎么处理。现在我回来了。」", "conflictPattern": "【阶段一 · 升级】对方提出需求，你觉得被要求，语气变冷。\n你的内心戏：ta 又在控制我。\n你该做的：说出感受，而不是讲道理。「我听到的是你在要求我，我有点压力。」\n不要做：立刻反驳「我哪有」。\n\n【阶段二 · 爆发】你开始挑刺、翻旧账，或者直接说「那我们算了吧」。\n你的内心戏：只要我先说分手，就不会被甩。\n你该做的：把「分手」两个字吞回去。它解决不了问题，只会制造新的问题。\n不要做：用离开测试对方会不会挽留。\n\n【阶段三 · 僵持】你消失、冷处理，等对方先低头。\n你的内心戏：我需要空间，ta 应该懂。\n你该做的：给一个明确的时间点。「我需要两小时，晚上八点我们聊。」\n不要做：已读不回、拉黑、突然取消所有计划。\n\n【阶段四 · 修复】你回来，但装作什么都没发生。\n你的内心戏：过去了就算了。\n你该做的：主动复盘一句。「上次我走开让你难受了，下次我会先说一声。」\n不要做：把修复全部推给对方。", "communicationGuide": "场景1｜表达需求\n❌「别管我。」\n✅「我很享受和你在一起，但我也需要独处充电，这不是在躲你。」\n\n场景2｜表达不安\n❌ 直接消失。\n✅「我现在有点乱，需要一点时间，但我不是要离开你。」\n\n场景3｜对方吃醋\n❌「你想太多了。」\n✅「我和 ta 只是朋友，但我在意你的感受，我们可以聊聊边界。」\n\n场景4｜对方冷淡\n❌ 立刻撤退，先冷回去。\n✅「我感觉到你有点远，是发生什么了吗？」\n\n场景5｜你想冷静一下\n❌ 已读不回。\n✅「我需要几个小时消化一下，今晚十点前我一定回你。」\n\n场景6｜谈未来和承诺\n❌「以后再说吧。」\n✅「我还没想清楚，但我愿意和你一起想，你给我一点时间。」\n\n场景7｜道歉\n❌「行吧，算我错了。」\n✅「上次我说话太冲，伤到你了，对不起。我想知道怎么做能让你好受一点。」\n\n场景8｜拒绝和设边界\n❌ 找借口逃避。\n✅「这件事我现在做不到，但我们可以一起找别的办法。」\n\n【万能句】「我不是要推开你，我只是需要一点时间，然后我会回来。」", "scenarioPractice": "场景 A｜ta 想每天见面，你觉得喘不过气\n你可能会：开始找借口加班、减少回复。\n更好的做法：把频率说清楚。「我真的很喜欢见你，但每天见面我会有点累。我们固定周三和周末，其余时间各自安排，好吗？」\n\n场景 B｜ta 在你面前哭了，你不知道怎么办\n你可能会：讲道理、给方案，或者沉默。\n更好的做法：先靠近。「我不知道该说什么，但我在这儿。」有时候陪伴比解决更重要。\n\n场景 C｜你发现自己开始挑 ta 的毛病\n你可能会：顺着挑下去，然后越来越想分手。\n更好的做法：停下来问自己：「我是真的受不了 ta，还是在害怕关系变近？」把答案告诉 ta，而不是直接行动。", "loveTimeline": "0-1 个月｜心动期\n你像朋友一样自然，魅力全开，但心里留着退路。关键动作：别急着定义关系，先享受；同时观察 ta 是否尊重你的空间。\n\n2-3 个月｜升温期\n如果对方不逼你，你会开始主动分享生活。关键动作：主动约一次，而不是总等对方开口；让 ta 看到你真实的一面。\n\n3-6 个月｜拉扯期\n你可能会突然恐慌「我是不是太依赖 ta 了」，开始挑刺或冷处理。关键动作：把恐慌说出来，而不是用行动表达。\n\n6-12 个月｜稳定期\n你学会把「需要 ta」和「失去自己」分开。关键动作：一起定一个「自由协议」，明确各自的空间和底线。\n\n1 年以后｜长期期\n关系从激情变成伙伴。关键动作：每年一起做一件新鲜事，防止关系变成例行公事。\n\n【最大风险】你在关系变好之前先离开，然后告诉自己「果然不合适」。", "idealPartner": "【你会被谁吸引】有自己的世界、情绪稳定、不查岗也不冷暴力的人。ta 能和你并肩，也能各自精彩。你容易被「不黏人但有温度」的人吸引。\n\n【三个雷区】\n1. 控制欲强、要求随时报备的人——你会窒息。\n2. 一吵架就死缠烂打的人——你会更想逃。\n3. 把「你不爱我」当口头禅的人——你会被耗干。\n\n【三个必须】\n1. ta 必须有自己的生活，不能把你当唯一支点。\n2. ta 必须能直接表达需求，而不是用情绪逼你猜。\n3. ta 必须接受「你需要独处」这件事，而不是把它当成拒绝。\n\n【最佳搭配】🌊 管家（给你空间）、☀️ 妈妈（温暖但不黏人）", "partnerManual": "把这份说明转给 ta，比吵十次架有用：\n\n1. 他不是不在乎你，他只是需要独处来恢复能量。\n2. 不要用查岗换安全感，那只会把他推远。\n3. 直接说需求，别让他猜。他不太擅长读空气。\n4. 他消失时，先给他两小时，再发一条不带指责的消息。\n5. 不要用分手威胁他，他会当真，并且真的走。\n6. 他有自己的朋友和爱好，那不是不爱你。\n7. 他示弱的时候，请认真接住，那对他很难。\n8. 他需要你也有自己的生活，太黏会让他有压力。\n9. 他记得你的好，只是不常说。\n10. 如果你能给他自由，他反而会自愿留下。", "compatibility": "高匹配：🌊 管家、☀️ 妈妈、🏔️ 军师\n和 ta 们相处：你们节奏接近，彼此尊重边界，关系容易长久。\n\n需要磨合：🔥 仆人（太黏）、🌙 小祖宗（需要高频回应）\n和 ta 们相处：提前说清楚你的「独处需求」，别让对方用猜测填补空白。\n\n容易互相消耗：🌹 公主病（都在试探）、🧜‍♀️ 万人迷（都想掌控）\n和 ta 们相处：少玩心理战，多给明确回应，否则两个人都会累。", "redFlags": "下面 10 条里，如果中了 3 条以上，别再替这段关系找借口：\n1. ta 要求你随时报备行踪。\n2. ta 用情绪或眼泪逼你妥协。\n3. ta 贬低你的朋友和爱好。\n4. ta 检查你的手机、社交账号。\n5. ta 说「你离开我什么都不是」。\n6. ta 每次冲突都威胁分手。\n7. ta 从不直接说需求，只让你猜。\n8. ta 把你的独处解读成背叛。\n9. ta 让你越来越不像自己。\n10. 你在这段关系里，长期感到窒息而不是自由。", "growthPlan": "第 1 周｜看见逃跑\n· 记录 3 次「想消失」的瞬间：当时发生了什么、你脑补了什么。\n· 每次想逃时，先等 10 分钟再做决定。\n· 对一个人说一次：「我需要空间，不是不要你。」\n\n第 2 周｜练习停留\n· 把一次「消失」换成「我需要两小时，之后我找你」。\n· 主动分享一件今天发生的小事。\n· 对方表达需求时，先回应感受，再谈边界。\n\n第 3 周｜练习表达\n· 每天说一句真实感受，不用长。\n· 说一次「我其实有点怕」。\n· 回顾：你最常用来逃跑的借口是什么？\n\n第 4 周｜建立协议\n· 和 ta 一起定「自由协议」：各自保留什么空间、哪些事必须说。\n· 约定冲突时的冷静时长和回归时间。\n· 写下一句承诺：「我可以自由，但我不逃。」\n\n【每周复盘】这周我有几次想逃？我留下了吗？是什么让我留下？", "yearPlan": "第 1-3 个月｜稳定节奏\n目标：让「独处」和「亲密」共存。每月至少一次主动分享内心，而不是只分享日常。\n\n第 4-6 个月｜练习承诺\n目标：不再用「随时能走」保护自己。和 ta 讨论一次半年后的计划，并真的为它做一件事。\n\n第 7-9 个月｜处理冲突\n目标：冲突时不消失。把「冷静两小时」变成固定机制，而不是逃跑。\n\n第 10-12 个月｜建立长期感\n目标：让 ta 进入你的重要决定。你会发现，被需要并不会让你失去自由。", "letterToFuture": "写给半年后那个还敢自由的你：\n\n那时候的你，可能已经在一段关系里待了半年。希望你不再需要靠「随时能走」来获得安全感。\n\n希望你明白：真正的自由，不是没有人管你，而是有人愿意给你自由，你也不想走。\n\n如果有一天你又想逃，先问问自己：我是想离开 ta，还是想离开这种失控感？\n\n你值得被爱，也值得在不失去自己的前提下被爱。", "theoryNote": "本报告参考：Bowlby 依恋理论、Sue Johnson 情绪取向疗法（EFT）、Brené Brown 关于脆弱与羞耻的研究。"};
    personalities.flame.fullReport = {"corePortrait": "你的核心剧本是「我付出得越多，就越值得被爱」。\n\n【核心渴望】被需要。你希望自己在对方的世界里是不可替代的，是被优先选择的。\n【核心恐惧】不够好。你怕自己一旦停下来、不再付出，就会被抛下。\n【防御机制】超额付出。你用行动、热情、照顾，把对方牢牢绑在身边，也把自己耗到见底。\n【关系角色】你是那个永远在奔跑的人。你怕一停，爱就散了。\n\n别人眼中的你：热烈、直接、敢爱敢恨，像一团火。\n真实的你：很怕自己不够好，很怕被比较，很怕付出得不到回应。\n\n你不是爱得太满，你是太怕失去。你把「我给得起」当成「我值得被爱」的证据。", "originStory": "你的热情，来自一个信念：爱是要主动争取的。\n\n【家庭剧本】也许你从小就是那个「懂事、会照顾人」的孩子：帮大人分担、哄人开心、不给家里添麻烦。你发现，只要自己有用，就能换来一点关注。也许你经历过「不表达就错过」的遗憾：喜欢的人被别人追走，想要的东西没敢开口。从那以后，你决定不再等，先冲出去再说。\n\n【形成的信念】「我必须有用，才会被爱。」「只要我足够努力，ta 就不会走。」「停下来就会被超过。」\n\n【成年后的投射】你长成了一个热烈的人：敢爱敢恨，全力以赴。你会在对方开口之前就把事情做好，也会在对方还没表态时就把心交出去。但你也把「被爱」和「有用」绑在了一起，所以你很难心安理得地接受别人的好。\n\n你值得被爱，不是因为你做了什么，而是因为你本身。", "attachmentStyle": "你的依恋底色是「焦虑型」：你很容易投入，也很容易因为对方的回应变慢而恐慌。\n\n【你的依恋雷达】你对「被冷落」极其敏感。消息回慢一点、语气短一点、表情淡一点，你都能捕捉到，并且迅速脑补出一整部剧。\n\n【被触发时】你会追问、试探、加倍付出，或者用「那算了吧」来逼对方表态。\n【安全时】当对方稳定回应、主动分享、明确表达喜欢，你会变得非常踏实，甚至有点黏人。\n\n【走向安全的关键】把「ta 没回我」和「ta 不爱我」分开。你需要的是确认，不是审判；是表达，不是逼问。你越能自己安抚自己，对方越愿意靠近你。", "strengthsDeep": "1. 你敢爱。喜欢就说，想念就讲，不会让对方猜来猜去。你的直接本身就是一种安全感。\n2. 你有行动力。ta 随口说想吃的东西，你第二天就买来了。你的爱不是嘴上说说，是看得见的。\n3. 你能扛事。关系遇到问题，你不会逃，你会想办法解决。你是那种「有事我在」的人。\n4. 你有感染力。你的热情能让一段关系快速升温，也能把对方从低谷里拉出来。\n5. 你忠诚。一旦认定，你会把对方放进自己的未来规划里，并且愿意为这个未来吃苦。", "blindSpots": "1. 你把付出当筹码。你嘴上说「不用回报」，心里却在记账。账不平的时候，你会突然爆发。\n2. 你爱得太快。还没看清对方是谁，就已经把全部交出去。你爱上的是自己的想象，不是真实的人。\n3. 你用热情盖住不安。你一忙起来，就不必面对「ta 到底爱不爱我」。但问题不会因为你不看就消失。\n4. 你不给对方喘息。你的关心太密，对方会觉得被淹没，然后开始躲你。\n5. 你把自己的价值绑在 ta 的回应上。ta 一冷淡，你就觉得自己一文不值。这是最危险的一条。", "triggerPoints": "【轻度警报】对方回消息变慢、语气变短\n身体信号：心跳加快、反复看手机、开始编辑又删除\n内心戏：ta 是不是烦我了？\n应对：先放下手机 10 分钟，做一件自己的事，再决定要不要发第二条。\n\n【中度触发】对方说「我想一个人静静」\n身体信号：胸口发紧、立刻反思「是不是我做错了什么」\n内心戏：ta 要离开我了。\n应对：回一句「好，我尊重你，晚点我再来找你」，然后真的去忙自己的事。\n\n【彻底爆发】对方忽冷忽热、态度暧昧、和别人走得近\n身体信号：愤怒、委屈、想摊牌、想说「那就算了吧」\n内心戏：我付出这么多，你凭什么这样对我？\n应对：先睡一觉，第二天再谈。不要在情绪最高点做任何决定。\n\n【事后修复】告诉对方：「我刚才追得太紧，是因为我怕失去你，不是想控制你。」", "conflictPattern": "【阶段一 · 升级】你感到不安，开始追问：「你怎么了？」「你是不是不喜欢我了？」\n你的内心戏：只要 ta 给我一个答案，我就安心了。\n你该做的：把追问换成表达。「我有点不安，需要你抱抱我。」\n不要做：连发十条消息逼对方回应。\n\n【阶段二 · 爆发】对方越解释你越不信，你开始翻旧账、说反话、提分手。\n你的内心戏：如果 ta 挽留我，就说明 ta 还爱我。\n你该做的：离开现场 20 分钟，让身体先降温。\n不要做：用分手做测试，测试多了会成真。\n\n【阶段三 · 僵持】你等对方来哄，对方觉得你无理取闹，两个人都不动。\n你的内心戏：明明是 ta 的错，凭什么我先低头？\n你该做的：先递一个台阶。「我不想赢了，我想解决问题。」\n不要做：用冷战惩罚对方。\n\n【阶段四 · 修复】你后悔说重话，但又拉不下脸。\n你的内心戏：我都这么难过了，ta 应该先来找我。\n你该做的：直接道歉，不解释动机。「我昨天话说重了，对不起。」\n不要做：一边道歉一边翻旧账。", "communicationGuide": "场景1｜表达需求\n❌「你到底怎么想的？」\n✅「我最近有点不确定你的想法，能和我聊聊吗？」\n\n场景2｜表达不安\n❌ 连环追问、查手机。\n✅「我今天有点没安全感，能多陪我说会儿话吗？」\n\n场景3｜对方吃醋\n❌ 立刻表忠心、删好友。\n✅「我心里只有你，但你也可以告诉我你在担心什么。」\n\n场景4｜对方冷淡\n❌「不喜欢就算了。」\n✅「我感觉你在退后，我愿意等，但需要知道你的真实想法。」\n\n场景5｜你想冷静\n❌ 摔门、拉黑。\n✅「我现在情绪很满，怕说伤人的话，给我一小时。」\n\n场景6｜谈未来\n❌「你到底要不要和我结婚？」\n✅「我想知道你怎么看我们的以后，不用现在回答，认真想想就好。」\n\n场景7｜道歉\n❌「我错了行了吧。」\n✅「我不该用分手试探你，这很伤人，对不起。」\n\n场景8｜拒绝\n❌ 硬撑着答应，然后委屈。\n✅「这件事我做不到，不是不爱你，是我需要先照顾自己。」\n\n【万能句】「我现在很不安，但我不想用吵架来证明你在乎我。你能抱抱我吗？」", "scenarioPractice": "场景 A｜ta 一整天没回消息\n你可能会：连发消息、打电话、开始想最坏的结果。\n更好的做法：先做自己的事，晚上发一条：「今天没怎么联系，有点想你。忙完了跟我说一声。」\n\n场景 B｜ta 说「你对我太好了，我有点压力」\n你可能会：更努力地付出，想证明自己没问题。\n更好的做法：停下来问：「那我做什么会让你舒服一点？」然后真的减少一点。\n\n场景 C｜你发现自己又在翻旧账\n你可能会：越说越委屈，把三年前的事都翻出来。\n更好的做法：告诉对方：「我还在为上次的事难过，我们能不能只谈这一件？」", "loveTimeline": "0-1 个月｜上头期\n你很快投入 100%，恨不得把全世界都给 ta。关键动作：留一点观察期，别只看甜；看 ta 是否也会主动。\n\n2-3 个月｜落差期\n对方节奏慢下来，你开始怀疑「ta 是不是没那么喜欢我」。关键动作：直接问，别靠猜；把不安说出来。\n\n3-6 个月｜博弈期\n你的热情可能变成压力，容易吵架、试探、说反话。关键动作：把「你为什么不」换成「我需要」。\n\n6-12 个月｜稳定期\n你学会把「付出」和「自我」分开。关键动作：保留一件与恋爱无关的长期爱好。\n\n1 年以后｜长期期\n关系从燃烧变成取暖。关键动作：定期确认彼此的需求，而不是默认对方知道。\n\n【最大风险】你把对方宠坏，然后怪对方不珍惜。", "idealPartner": "【你会被谁吸引】接得住你的热情、也会主动回应的人。ta 不需要和你一样热烈，但不能让你一直猜。你容易被「稳定、温和、有回应」的人吸引。\n\n【三个雷区】\n1. 享受你的好却从不回馈的人——你会被耗空。\n2. 习惯冷处理、玩消失的人——你会疯。\n3. 把你的付出当理所当然的人——你会越来越委屈。\n\n【三个必须】\n1. ta 必须会主动表达，而不是只享受被爱。\n2. ta 必须情绪稳定，能接住你的不安。\n3. ta 必须把你放进未来，而不是只活在当下。\n\n【最佳搭配】🦋 浪子（给你空间但不会冷）、🌹 公主病（你的热情能融化 ta 的壳）", "partnerManual": "如果你爱的是一个把全部都给出的人，请这样接住 ta：\n\n1. 他热情，但热情底下是不安。请多给他明确的回应。\n2. 不要用冷处理惩罚他，他会真的崩溃。\n3. 他付出时，请说谢谢，也请回馈，哪怕很小。\n4. 他追问时，别嫌他烦，那是他在求救。\n5. 不要让他一直猜你的想法，他猜的通常是最坏的那个。\n6. 他需要你主动一次，哪怕只是先发一句「我想你了」。\n7. 他嘴上说「没事」，通常是有事。\n8. 不要拿他和别人比较，他会记很久。\n9. 他愿意为你扛很多，但请别让他一直扛。\n10. 你稳定的回应，就是他最好的安全感。", "compatibility": "高匹配：🦋 浪子、🌹 公主病、🌙 小祖宗\n和 ta 们相处：你的热情能被接住，但记得给对方回应的空间。\n\n需要磨合：🏔️ 军师（太理性）、🌊 管家（太慢热）\n和 ta 们相处：别用情绪逼 ta 表态，用具体请求代替试探。\n\n容易互相消耗：🧜‍♀️ 万人迷（你追 ta 躲）、🐠 小丑（你认真 ta 开玩笑）\n和 ta 们相处：先确认对方是否愿意认真，再决定投入多少。", "redFlags": "这 10 条不是让你疑神疑鬼，是让你清醒。中 3 条以上，请停下来看看：\n1. ta 只在需要你的时候出现。\n2. ta 从不主动，永远是你找 ta。\n3. ta 把你的付出说成「你自愿的」。\n4. ta 用冷淡惩罚你。\n5. ta 和其他异性边界模糊，还说你想多了。\n6. ta 从不谈未来。\n7. ta 让你觉得自己不够好。\n8. ta 一吵架就消失。\n9. ta 需要你不断证明爱。\n10. 你在这段关系里，越来越累而不是越来越安心。", "growthPlan": "第 1 周｜停下来\n· 想发第二条消息时，先放下手机 10 分钟。\n· 记录 3 次「我其实在等 ta 回复」的时刻。\n· 每天留 30 分钟给一件与恋爱无关的事。\n\n第 2 周｜把爱分给自己\n· 做一件只为自己开心的事，不告诉对方。\n· 接受 ta 的一次照顾，不抢着回报。\n· 写下 3 个「就算没有 ta，我也依然完整」的理由。\n\n第 3 周｜练习直接\n· 把「你是不是不爱我了」换成「我现在需要你抱抱我」。\n· 说一次「我今天很难过」，不解释、不道歉。\n· 对方冷淡时，先照顾自己，不追问。\n\n第 4 周｜重写信念\n· 每天读一遍：「我值得被爱，不需要靠拼命付出来换。」\n· 和 ta 谈一次彼此的付出方式。\n· 写下一个「不再做」的清单。\n\n【每周复盘】这周我付出的，有多少是爱，有多少是害怕？", "yearPlan": "第 1-3 个月｜建立安全感\n目标：不再靠追问获得确认。每天记录一件「ta 主动为我做的事」。\n\n第 4-6 个月｜练习接受\n目标：让 ta 照顾你。每周至少一次，坦然接受而不立刻回报。\n\n第 7-9 个月｜找回自己\n目标：建立一件与恋爱无关的长期投入，让自我价值不再只来自关系。\n\n第 10-12 个月｜平等相爱\n目标：把「我为你做了什么」换成「我们今天过得怎么样」。", "letterToFuture": "给 6 个月后，终于学会被爱的你：\n\n希望你不再用「我对你这么好」来换一句「我也爱你」。\n\n希望你知道，你的热情很珍贵，但它不应该成为你证明自己值得被爱的唯一方式。\n\n如果有一天你又想加倍付出，先停一下，问问自己：我是想爱 ta，还是想确认 ta 不会走？\n\n你本来就值得被爱，不需要一直跑。", "theoryNote": "本报告参考：Ainsworth 依恋类型研究、Gary Chapman《爱的五种语言》、Sue Johnson 情绪取向疗法（EFT）。"};
    personalities.moon.fullReport = {"corePortrait": "你的核心剧本是「你要证明你不会走，我才敢把自己交给你」。\n\n【核心渴望】被偏爱。你希望自己在对方心里是「例外」，不是「之一」。\n【核心恐惧】被放在第二位。你怕的不是孤独，而是有人陪着你，却让你觉得随时可以被替换。\n【防御机制】试探和作。你用「没事」「随便」「你走吧」来测试对方会不会留下来。\n【关系角色】你是那个需要被哄的人。不是因为你难搞，而是你的安全感系统天生更灵敏。\n\n别人眼中的你：敏感、爱想多、需要人哄。\n真实的你：只是太容易捕捉到细微的变化，又太不敢直接说出「我需要你」。\n\n你想要的从来不是无理取闹的特权，而是「我在你这里是重要的」这件事，被反复确认。", "originStory": "你的敏感，可能来自一个需要你「察言观色」的成长环境。\n\n【家庭剧本】也许你小时候只有表现好、懂事、不添麻烦，才能得到关注。也许你哭的时候被说「有什么好哭的」，于是你学会把委屈咽下去。你很快就能读懂大人的脸色，却很少有人认真读懂你的。\n\n【形成的信念】「我的需求是麻烦。」「我要先照顾别人的情绪。」「如果我不够好，就会被忽略。」\n\n【成年后的投射】你长成了一个很会照顾别人情绪的人，却不太会照顾自己。你希望有一个人能主动看见你、哄你、把你放在第一位，因为那是你小时候没得到的东西。\n\n你不是作，你是在用尽全力确认：这一次，我是不是终于被选中了。", "attachmentStyle": "你的依恋底色是「焦虑型偏重」：你对关系的稳定性高度敏感，需要持续的确认。\n\n【你的依恋雷达】对方一个语气词、一次延迟回复、一个没接住的情绪，你都能放大成一整套剧情。\n\n【被触发时】你会反复回想对话、检查细节、试探对方，嘴上说「没事」，心里已经演了八十集。\n【安全时】当对方稳定、主动、愿意解释，你会变得非常柔软、非常忠诚，愿意为这段关系付出很多。\n\n【走向安全的关键】把「ta 没做到」和「ta 不爱我」分开。你需要的是表达需求，而不是测试爱。测试会让爱你的人越来越累，也会让你越来越不安。", "strengthsDeep": "1. 你的共情力极强。对方还没开口，你就知道 ta 今天不对劲。你能接住别人接不住的情绪。\n2. 你温柔体贴。你会记得对方随口说过的喜好，也会在细节里照顾 ta。\n3. 你对感情认真。你不玩暧昧，不养鱼，喜欢就是喜欢。\n4. 你愿意沟通。只要对方愿意好好说，你其实很讲道理。\n5. 你忠诚。一旦确认安全，你会把对方放进自己生活的中心。", "blindSpots": "1. 你用「作」来测试爱。你想确认对方不会走，但测试本身会把对方推走。\n2. 你不直接说需求。你希望对方猜中，猜不中你就失望，对方还一脸茫然。\n3. 你把小事放大。一次晚回、一个表情，都能让你脑补出分手的剧本。\n4. 你容易内耗。你把情绪憋在心里反复咀嚼，最后爆发时对方完全不知道发生了什么。\n5. 你可能过度依赖。你把全部安全感放在一个人身上，对方会累，你也会失去自己。", "triggerPoints": "【轻度警报】对方回消息变慢、表情变淡\n身体信号：心慌、反复看手机、开始回想自己说错了什么\n内心戏：ta 是不是不喜欢我了？\n应对：先写下「事实是什么 / 我脑补了什么」，等 10 分钟再发消息。\n\n【中度触发】对方和异性互动、忘记约定、临时取消计划\n身体信号：胸口堵、想哭、嘴上说「没事」\n内心戏：我在 ta 心里根本不重要。\n应对：把「没事」换成「我有点难过，因为今天的事，你能抱抱我吗？」\n\n【彻底爆发】对方说「你想太多了」或「你能不能别作」\n身体信号：崩溃、发抖、想立刻分手\n内心戏：我的感受在 ta 眼里一文不值。\n应对：先离开现场，告诉自己：「我的感受是真的，但我现在不适合沟通。」等情绪降下来再谈。\n\n【事后修复】告诉对方：「我刚才反应很大，是因为我很怕被忽略，不是想怪你。」", "conflictPattern": "【阶段一 · 升级】你察觉到一丝冷淡，开始试探：「你是不是不高兴？」「我是不是说错话了？」\n你的内心戏：我要先确认，不然我会一直不安。\n你该做的：直接说感受。「我今天有点不安，想要你抱抱我。」\n不要做：用「没事」开头，然后等对方猜。\n\n【阶段二 · 爆发】对方没接住，你委屈升级，开始说反话、翻旧账、提分手。\n你的内心戏：如果 ta 在乎我，就会来哄我。\n你该做的：停下来，说出真正的需求。「我不是想吵架，我是想被你在乎。」\n不要做：用分手测试对方。\n\n【阶段三 · 僵持】你生闷气，对方觉得莫名其妙，两个人越离越远。\n你的内心戏：ta 根本不懂我。\n你该做的：给一个具体的线索。「我现在需要你抱我一下，或者听我说五分钟。」\n不要做：等对方读心。\n\n【阶段四 · 修复】你想和好，但又怕显得自己太主动。\n你的内心戏：明明是我受委屈，为什么还要我先低头？\n你该做的：先修复情绪，再谈对错。「我们先和好，好吗？然后我想跟你说说我当时的感受。」\n不要做：和好了又翻旧账。", "communicationGuide": "场景1｜表达需求\n❌「你是不是不爱我了？」\n✅「我最近有点不安，需要你多陪我一会儿。」\n\n场景2｜表达不安\n❌ 生闷气等对方猜。\n✅「我现在很难过，因为 XX，你能先抱抱我吗？」\n\n场景3｜对方吃醋\n❌ 立刻删好友证明。\n✅「我在意你，但我也需要正常的社交，我们可以聊聊边界。」\n\n场景4｜对方冷淡\n❌ 连环追问。\n✅「我感觉你有点远，我不想逼你，但想知道发生了什么。」\n\n场景5｜你想确认关系\n❌ 用分手试探。\n✅「我有时候会怕你离开，你能告诉我，你怎么看我们吗？」\n\n场景6｜对方忘记重要日子\n❌「你根本不在乎我。」\n✅「今天这个日子对我很重要，你没记得，我有点失落。」\n\n场景7｜道歉\n❌「对不起行了吧，都是我不好。」\n✅「我刚才说话太冲了，我不该把情绪都撒在你身上。」\n\n场景8｜拒绝\n❌ 勉强答应，然后委屈。\n✅「我今天真的没有力气，不是不想陪你，我们明天好吗？」\n\n【万能句】「我现在不是在怪你，我是在告诉你，我需要什么。」", "scenarioPractice": "场景 A｜ta 和异性朋友吃饭，没提前告诉你\n你可能会：脑补一整部剧，然后冷脸、试探、翻手机。\n更好的做法：「我知道你们是朋友，但我还是会有点不安。下次能提前跟我说一声吗？」\n\n场景 B｜ta 忙了一周，没怎么陪你\n你可能会：憋到周末一次性爆发。\n更好的做法：中途就说：「我知道你忙，我也不是要你一直陪我。但今天能给我十分钟吗？」\n\n场景 C｜你发现自己又在等 ta 猜\n你可能会：说「没事」，然后失望。\n更好的做法：直接给答案。「我现在需要你哄我，不用讲道理，抱一下就好。」", "loveTimeline": "0-1 个月｜试探期\n你小心翼翼，不敢太投入，暗中观察 ta 靠不靠谱。关键动作：别急着测试，先看 ta 是否稳定。\n\n2-3 个月｜依赖期\n一旦对方稳定回应，你会迅速陷进去。关键动作：保留一点自己的生活，别把全部重心交出去。\n\n3-6 个月｜危机期\n一次冷淡、一次失约，都可能引发你的安全感地震。关键动作：把「作」换成直接表达。\n\n6-12 个月｜稳定期\n如果 ta 通过了考验，你会非常忠诚、非常投入。关键动作：学会自我安抚，而不是每次都等 ta 来救。\n\n1 年以后｜长期期\n你开始相信「ta 不会走」，关系变得松弛。关键动作：把安全感慢慢长回自己身上。\n\n【最大风险】你用测试筛掉了真心的人，留下了会玩套路的人。", "idealPartner": "【你会被谁吸引】情绪稳定、有耐心、愿意主动表达的人。ta 不需要多浪漫，但要让你「不用猜」。你容易被「稳、暖、说到做到」的人吸引。\n\n【三个雷区】\n1. 忽冷忽热、玩消失的人——你会被逼疯。\n2. 嫌你敏感、说你「想太多」的人——你会越来越不敢表达。\n3. 永远把朋友/工作排在你前面的人——你会持续受伤。\n\n【三个必须】\n1. ta 必须情绪稳定，能接住你的波动。\n2. ta 必须愿意主动表达，而不是让你猜。\n3. ta 必须把你放进优先级，而不是「有空再说」。\n\n【最佳搭配】🌊 管家（稳重给你安全感）、☀️ 妈妈（温暖治愈你的不安）", "partnerManual": "ta 不是难搞，只是需要被稳稳接住。请收好这 10 条：\n\n1. 她的敏感不是作，是雷达太灵。请先接住情绪，再讲道理。\n2. 不要对她说「你想太多了」，那等于否定她的感受。\n3. 她问「你爱不爱我」时，她要的不是答案，是确认。\n4. 主动报备不是被控制，是她安全感的来源之一。\n5. 她嘴上说「没事」，通常是有事。请多问一句。\n6. 她需要被放在优先级里，哪怕只是一个小小的时间段。\n7. 不要用冷战惩罚她，她会自己脑补到最坏。\n8. 她记得所有细节，也请你记得一些。\n9. 她愿意为你付出很多，但请别让她一直不安。\n10. 你稳定一点，她就会柔软很多。", "compatibility": "高匹配：🌊 管家、☀️ 妈妈、🌳 保镖\n和 ta 们相处：对方稳定、有耐心，你的不安能被接住。\n\n需要磨合：🦋 浪子（太自由）、🏔️ 军师（太理性）\n和 ta 们相处：直接说出需求，别指望对方自己懂。\n\n容易互相消耗：🌹 公主病（都在等对方证明）、🔥 仆人（两个人都要强烈回应）\n和 ta 们相处：先约定「谁先开口」的规则，避免无限试探。", "redFlags": "如果下面有 3 条以上让你心里一沉，那你的不安不是空穴来风：\n1. ta 经常消失，事后只说「忙」。\n2. ta 说你「太敏感」「想太多」。\n3. ta 从不主动报备，也不觉得需要。\n4. ta 和异性边界长期模糊。\n5. ta 只在需要你的时候热情。\n6. ta 用冷暴力处理冲突。\n7. ta 从不谈未来。\n8. ta 让你不断怀疑自己。\n9. ta 需要你反复证明爱。\n10. 你在这段关系里，越来越不安而不是越来越踏实。", "growthPlan": "第 1 周｜看见脑补\n· 每次不安时，写下「事实是什么 / 我脑补了什么」。\n· 记录 3 次「我其实想被哄」的时刻。\n· 不安时先做 3 次深呼吸，等 10 分钟再发消息。\n\n第 2 周｜直接表达\n· 把「没事」换成「我有点难过，因为 XX」。\n· 把「你是不是不爱我了」换成「我需要你多陪我一会儿」。\n· 每天说一句具体的需求，不用长。\n\n第 3 周｜自我安抚\n· 不安时先做一件能让自己稳定的事：散步、洗澡、写下来。\n· 写下 3 个「即使没有 ta，我也很好」的理由。\n· 练习一个人待一晚，不反复看手机。\n\n第 4 周｜建立内在安全\n· 和 ta 一起定「安全感协议」：哪些事需要报备、冲突时怎么修复。\n· 每天写一件「今天我被爱着」的证据。\n· 回顾：这周我有几次用「作」代替表达？\n\n【每周复盘】这周我的不安，有多少来自 ta，有多少来自我的想象？", "yearPlan": "第 1-3 个月｜稳定情绪\n目标：把「试探」减少一半。每次想作的时候，先说出需求。\n\n第 4-6 个月｜建立自我\n目标：找回一件只属于自己的事，让安全感不完全依赖对方。\n\n第 7-9 个月｜练习信任\n目标：在对方没有及时回应时，也能自己稳住，不立刻脑补最坏结果。\n\n第 10-12 个月｜松弛地爱\n目标：从「你要证明不会走」变成「我相信我们，也相信自己」。", "letterToFuture": "给 6 个月后，不用再反复确认的你：\n\n希望你不再需要靠「作」来确认自己被爱。\n\n希望你遇到一个愿意主动走向你的人，也希望你慢慢学会，即使对方偶尔没接住，你也不会立刻崩塌。\n\n你的敏感不是缺点，它让你能爱得很深。但请记得，安全感最终要长在你自己身上。\n\n你值得被偏爱，也值得不再害怕。", "theoryNote": "本报告参考：Ainsworth 依恋类型研究、Sue Johnson 情绪取向疗法（EFT）、Marshall Rosenberg 非暴力沟通。"};
    personalities.whale.fullReport = {"corePortrait": "你的核心剧本是「我先观察，确认安全，才敢交出真心」。\n\n【核心渴望】被信任。你希望有人愿意花时间懂你，而不是要求你立刻表态。\n【核心恐惧】被辜负。你怕的不是慢，而是认真之后发现对方根本不值得。\n【防御机制】沉默和观察。你用「再看看」保护自己，用行动代替语言。\n【关系角色】你是那个话不多、但什么都安排好的人。\n\n别人眼中的你：稳、冷、难接近，好像什么都不说。\n真实的你：感情很重，只是不敢轻易说出口。你怕说早了显得廉价，也怕说错了收不回来。\n\n你不是不爱，你是把爱看得太重要，所以不敢随便开始。", "originStory": "你的慢热，可能来自一次「太快相信却被辜负」的经历。\n\n【家庭剧本】也许你从小就学会了不轻易表露情绪，因为表达需求没有得到回应，甚至被嘲笑。也许你成长在一个「少说多做」的家庭，爱是饭桌上的一碗汤，不是一句「我爱你」。\n\n【形成的信念】「说得再好听，不如做一件实事。」「先认真的人会输。」「时间会证明一切。」\n\n【成年后的投射】你长成了一个可靠的大人：不轻易承诺，但答应了就一定做到。你会默默记住对方的喜好，却很少主动说「我想你」。你希望有人有耐心，愿意等你慢慢打开。\n\n你的沉默不是冷漠，是你把感情看得太重。", "attachmentStyle": "你的依恋底色是「回避型偏安全」：你不怕独处，但不太擅长在关系里表达需求。\n\n【你的依恋雷达】你对「被催促」很敏感。对方越逼你表态，你越想退回壳里。\n\n【被触发时】你会沉默、转移话题、用工作忙碌当借口。你不是在冷暴力，你只是不知道怎么处理。\n【安全时】当对方不急、不逼、愿意用行动陪你，你会慢慢打开，甚至变得很黏。\n\n【走向安全的关键】把「我不说」和「我不在乎」分开。你的沉默会被不懂你的人解读成不爱。你不需要变得能说会道，只需要每天多说一句。", "strengthsDeep": "1. 你可靠。答应的事一定做到，不会让你的人悬着。\n2. 你专一。你不轻易开始，但一旦认定，就很难放手。\n3. 你情绪稳定。你不会因为一点小事大起大落，是关系里的定海神针。\n4. 你会照顾人。你的爱藏在细节里：热水、外套、提前查好的路线。\n5. 你想得深。你能给出有质量的建议，也能在对方迷茫时稳住局面。", "blindSpots": "1. 你太慢热。等你确认完，喜欢的人可能已经走了。\n2. 你不表达。你心里有十分，对方只看到三分，然后以为你不在乎。\n3. 你用沉默处理冲突。对方会觉得被冷暴力，而你只是不知道怎么开口。\n4. 你太理性。你习惯解决问题，却忽略了对方此刻需要的是情绪回应。\n5. 你把「行动」当成全部。可有些人需要听见，才能相信。", "triggerPoints": "【轻度警报】对方太热情、太快说「我爱你」\n身体信号：后退、警惕、觉得不真实\n内心戏：ta 是不是对谁都这样？\n应对：不急着否定，也不急着回应。「我需要一点时间，但我愿意继续了解你。」\n\n【中度触发】对方逼你表达、追问「你到底爱不爱我」\n身体信号：烦躁、沉默、想结束话题\n内心戏：我说不出来，但我不是不爱。\n应对：给一句最低限度的真话。「我不太会说，但我希望你知道，我在意你。」\n\n【彻底爆发】对方拿你和别人比较、否定你的付出\n身体信号：心凉、关门、彻底沉默\n内心戏：原来我做的这些，ta 都看不见。\n应对：先离开，等情绪稳定后明确说：「你可以对我不满，但请不要否定我的付出。」\n\n【事后修复】告诉对方：「我沉默的时候，不是不在乎，是我需要时间组织语言。」", "conflictPattern": "【阶段一 · 升级】对方提出情绪需求，你不知道怎么回应，开始沉默。\n你的内心戏：我说不好，不如不说。\n你该做的：先说一句「我需要想一下，晚点回你」，而不是直接消失。\n不要做：用「嗯」「哦」敷衍。\n\n【阶段二 · 爆发】对方越逼，你越退，最后你选择冷战。\n你的内心戏：等大家都冷静了再说。\n你该做的：给出明确时间。「我需要两小时，之后我们好好谈。」\n不要做：无限期沉默。\n\n【阶段三 · 僵持】两个人都不说话，关系降到冰点。\n你的内心戏：ta 应该知道我不是那个意思。\n你该做的：主动打破僵局，哪怕只是一句「我们聊聊吧」。\n不要做：等对方先低头。\n\n【阶段四 · 修复】你想和好，但不知道怎么开口。\n你的内心戏：做点事 ta 应该就懂了。\n你该做的：行动加一句语言。「我给你带了你爱吃的，昨天是我不好。」\n不要做：只做事，不说话。", "communicationGuide": "场景1｜表达需求\n❌ 什么都不说。\n✅「我不太会说，但我希望你知道，我在意你。」\n\n场景2｜表达不安\n❌ 沉默、喝酒、消失。\n✅「我有点不安，但我说不清楚，你能陪我坐一会儿吗？」\n\n场景3｜对方吃醋\n❌ 觉得无聊，不解释。\n✅「我心里有你，只是我不擅长说，别自己吓自己。」\n\n场景4｜对方冷淡\n❌ 跟着冷。\n✅「我感觉我们有点疏远，我想知道你怎么了。」\n\n场景5｜你想独处\n❌ 突然消失。\n✅「我需要一点时间，不是你的问题，晚点我找你。」\n\n场景6｜谈未来\n❌「再说吧。」\n✅「我有认真想过，只是还需要一点时间。你愿意等我吗？」\n\n场景7｜道歉\n❌ 买礼物但不说话。\n✅「昨天是我不对，我不该沉默。对不起。」\n\n场景8｜拒绝\n❌ 硬扛，最后爆发。\n✅「这件事我做不到，但我不想骗你。」\n\n【万能句】「我不是不在乎，我只是需要一点时间。」", "scenarioPractice": "场景 A｜ta 抱怨你不够浪漫\n你可能会：觉得委屈，心想「我做了那么多」。\n更好的做法：「我知道你想要的是说出来。我不太擅长，但我可以学。你告诉我，你最想听什么？」\n\n场景 B｜ta 哭着说你不爱 ta\n你可能会：沉默、讲道理，越说越糟。\n更好的做法：先抱住 ta。「我嘴笨，但我在这儿。你告诉我，我哪里让你觉得不被爱？」\n\n场景 C｜你发现自己又在冷战\n你可能会：等对方先开口。\n更好的做法：发一条消息：「我不想冷战，我们聊聊，哪怕只说十分钟。」", "loveTimeline": "0-1 个月｜观察期\n你在心里默默打分，对方可能觉得你冷淡。关键动作：至少主动一次，别让 ta 以为你没兴趣。\n\n2-3 个月｜确认期\n如果你还愿意见面、愿意分享，说明 ta 通过了初试。关键动作：说一句明确的喜欢，不用很浪漫。\n\n3-6 个月｜打开期\n你开始展现真实的一面，但依然保留一部分。关键动作：让 ta 看到你的脆弱。\n\n6-12 个月｜信任期\n你才真正把 ta 放进未来。关键动作：主动谈一次未来。\n\n1 年以后｜长期期\n你的爱变成一种稳定的存在。关键动作：别让「稳定」变成「理所当然」。\n\n【最大风险】你的「不说」会被不懂你的人解读成「不爱」。", "idealPartner": "【你会被谁吸引】有耐心、不逼迫、能读懂你沉默的人。ta 愿意等你慢慢打开，也愿意主动一点。你容易被「温柔但有主见」的人吸引。\n\n【三个雷区】\n1. 急躁、天天逼你表态的人——你会更想退。\n2. 把你的沉默当冷暴力的人——你们会互相误解。\n3. 只会说漂亮话、没有行动的人——你不会信。\n\n【三个必须】\n1. ta 必须有耐心，愿意给你时间。\n2. ta 必须看重行动，也愿意表达。\n3. ta 必须稳定，不会因为你慢热就离开。\n\n【最佳搭配】🌙 小祖宗（同样细腻慢热）、🔥 仆人（热情能慢慢融化你）", "partnerManual": "ta 不擅长说，但很擅长做。请按这份说明去读 ta：\n\n1. 他不是冷，他只是慢。请给他时间。\n2. 不要逼他立刻表态，越逼他越退。\n3. 他的爱在行动里，请看见那些小事。\n4. 他沉默时，不代表不在乎，可能只是不会说。\n5. 他需要你主动一点，但不要咄咄逼人。\n6. 不要拿他和别人比较，他会记很久。\n7. 他说「随便」时，可能是真的没意见。\n8. 他答应的事一定会做到，请相信他。\n9. 他需要独处，但不是要离开你。\n10. 你耐心一点，他会把整颗心都给你。", "compatibility": "高匹配：🌙 小祖宗、🔥 仆人、🌳 保镖\n和 ta 们相处：对方愿意等，也愿意主动，你会慢慢打开。\n\n需要磨合：🧜‍♀️ 万人迷（太会撩让你警惕）、🦋 浪子（都保留退路）\n和 ta 们相处：先说清楚你的节奏，别让对方误以为你冷淡。\n\n容易互相消耗：🐠 小丑（你认真 ta 逃避）、🌹 公主病（都在等对方先低头）\n和 ta 们相处：别玩猜心，直接说需求。", "redFlags": "别急着否定。数一数，超过 3 条，就值得你认真掂量：\n1. ta 逼你立刻表态，不给你时间。\n2. ta 把你的沉默说成冷暴力，却不愿听你解释。\n3. ta 只说不做，承诺从不兑现。\n4. ta 拿你和别人比较。\n5. ta 否定你的付出。\n6. ta 需要你一直主动，自己从不向前。\n7. ta 在你慢热时威胁离开。\n8. ta 不尊重你的独处。\n9. ta 让你觉得表达是危险的。\n10. 你在这段关系里，越来越封闭而不是越来越打开。", "growthPlan": "第 1 周｜每天一句\n· 每天告诉 ta 一件你感激的小事，不用长。\n· 记录 3 次「我其实想说但没说」的时刻。\n· 对一个人说一次「我在意你」。\n\n第 2 周｜提前报备\n· 需要独处时，说「我需要两小时，不是你的问题」。\n· 忙的时候，发一条「晚点回你」，而不是直接消失。\n· 练习在沉默前先给一句解释。\n\n第 3 周｜行动加语言\n· 做一件小事后，补一句「这是我想为你做的」。\n· 说一次「我有点怕失去你」。\n· 回顾：你最常用来逃避表达的方式是什么？\n\n第 4 周｜谈未来\n· 主动和 ta 聊一次半年后的计划。\n· 告诉 ta 你的节奏和底线。\n· 写下一句承诺：「我会慢，但我不会走。」\n\n【每周复盘】这周我有几次想沉默？我开口了吗？", "yearPlan": "第 1-3 个月｜练习表达\n目标：每天一句真实的感受，让 ta 听见你。\n\n第 4-6 个月｜加快一点\n目标：把「再看看」缩短。遇到值得的人，主动一次。\n\n第 7-9 个月｜处理冲突\n目标：不再用沉默解决问题，学会在冷静后主动回来。\n\n第 10-12 个月｜建立长期\n目标：把 ta 放进你的未来，并且说出来。", "letterToFuture": "给 6 个月后，愿意把心事说出口的你：\n\n希望你遇到一个愿意等你的人，也希望你不再把「不说」当成保护。\n\n你的爱很重，也很稳，但爱需要被听见。\n\n如果有一天你又想沉默，试着先说一句：「我需要一点时间，但我不会走。」\n\n你值得被耐心对待，也值得被好好听见。", "theoryNote": "本报告参考：Bowlby 依恋理论、John Gottman 伴侣冲突研究、Gary Chapman《爱的五种语言》。"};
    personalities.sunflower.fullReport = {"corePortrait": "你的核心剧本是「只要我一直温暖、一直有用，就不会被丢下」。\n\n【核心渴望】被需要，也被照顾。你希望有人既享受你的好，也能看见你也会累。\n【核心恐惧】成为负担。你怕自己一旦不笑了、不体贴了，就不值得被爱。\n【防御机制】过度照顾。你把别人的情绪放在自己前面，用「我没事」把真实的自己藏起来。\n【关系角色】你是关系里的太阳，也是那个没人问「你晒不晒」的人。\n\n别人眼中的你：乐观、温暖、好相处，好像永远不会累。\n真实的你：也会委屈，也会想被人哄，只是不敢说。\n\n你不是没有情绪，你只是习惯了先照顾别人。", "originStory": "你的懂事，可能来自一个「你必须乖、必须让大人省心」的童年。\n\n【家庭剧本】也许你从小就负责哄人开心、调节气氛。家里有人不开心，你会想办法让 ta 笑；有人吵架，你会去当和事佬。你慢慢学会了把自己的难过收起来，因为「家里已经够乱了」。\n\n【形成的信念】「我的情绪会给别人添麻烦。」「只要我有用，就不会被丢下。」「我要做那个让大家开心的人。」\n\n【成年后的投射】你长成了一个很会照顾人的人：记得所有人的喜好，安排所有人的感受，却很少有人问你想要什么。你习惯了当给予者，以至于接受别人的好时，会手足无措。\n\n你不需要一直有用，才配被爱。", "attachmentStyle": "你的依恋底色是「安全型偏讨好」：你相信关系是好的，但不太相信自己可以被无条件爱。\n\n【你的依恋雷达】你对「别人不高兴」极其敏感，会本能地觉得是自己的责任。\n\n【被触发时】你会加倍付出、道歉、哄人，哪怕错的不是你。你用「我没事」把委屈压下去。\n【安全时】当对方也会照顾你、主动问你的感受，你会非常放松，也能坦然表达需求。\n\n【走向安全的关键】把「照顾别人」和「值得被爱」分开。你需要练习接受，也需要练习说「不」。真正的亲密，不是一个人一直给，而是两个人都能被接住。", "strengthsDeep": "1. 你有超强的共情力。你能敏锐地察觉别人的情绪，并且知道怎么让对方舒服。\n2. 你乐观有感染力。你能把低气压的关系重新点亮，是很多人的情绪支柱。\n3. 你体贴入微。你记得对方的喜好、习惯、重要日子，你的爱藏在细节里。\n4. 你包容。你愿意理解对方的难处，不轻易指责。\n5. 你可靠。你说会陪，就真的会陪；你答应的事，很少落空。", "blindSpots": "1. 你把自己的需求藏得太深。你盼着对方自己看出来，可 ta 不是你肚子里的蛔虫。\n2. 你用付出换安全感。你怕自己没用，就拼命对别人好，最后把自己耗空。\n3. 你不会拒绝。你答应了太多不想做的事，然后默默委屈。\n4. 你用「我没事」关上了门。对方想靠近，却总被你挡在外面。\n5. 你可能吸引到只会索取的人。你太能扛，对方就真的以为你不需要被照顾。", "triggerPoints": "【轻度警报】对方情绪低落却不和你说\n身体信号：不安、想帮忙、反复问「你怎么了」\n内心戏：是不是我没照顾好 ta？\n应对：先问一句「你想说吗？不想说我也在」，然后允许对方有自己的空间。\n\n【中度触发】你付出很多却被忽略\n身体信号：委屈、胸口闷、想说又咽回去\n内心戏：我做了这么多，为什么没人看见？\n应对：直接说出你的付出和需要。「我今天做了 XX，有点累，你能抱抱我吗？」\n\n【彻底爆发】对方说「你总是这么开心，你根本不懂我」\n身体信号：崩溃、眼泪止不住、觉得被否定\n内心戏：我也有难过，只是没让你看见。\n应对：告诉对方：「我不是不懂，我只是习惯了自己扛。其实我也有很多没说出口的难过。」\n\n【事后修复】对自己说一句：「我也可以被照顾。」然后向对方提一个具体的小请求。", "conflictPattern": "【阶段一 · 升级】对方不高兴，你立刻反思是不是自己的错，开始哄。\n你的内心戏：只要 ta 开心了，就没事了。\n你该做的：先分清责任。「你现在不开心，是因为我做了什么，还是别的事？」\n不要做：无条件道歉。\n\n【阶段二 · 爆发】你哄了很久没用，委屈突然涌上来，一次性爆发。\n你的内心戏：我做了这么多，你怎么能当作没看见？\n你该做的：提前表达，不要等到爆发。「我有点累了，我们能不能先停一下？」\n不要做：把所有旧账一次翻完。\n\n【阶段三 · 僵持】你继续照顾对方，但心里越来越冷。\n你的内心戏：算了，我自己消化。\n你该做的：说出你的界限。「我可以陪你，但我也需要被照顾。」\n不要做：用过度付出来惩罚自己。\n\n【阶段四 · 修复】对方来和好，你立刻说「没事」。\n你的内心戏：不想再添麻烦。\n你该做的：诚实一点。「我还有点难过，但我不想跟你僵着。」\n不要做：假装什么都没发生。", "communicationGuide": "场景1｜表达需求\n❌「我没事。」\n✅「我其实有点累，今天能听我说说吗？」\n\n场景2｜表达委屈\n❌ 笑着说「没关系」。\n✅「刚才那件事让我有点难过，我想跟你说说。」\n\n场景3｜对方吃醋\n❌ 过度解释、讨好。\n✅「我在意你，但我也有正常的社交，我们互相信任好吗？」\n\n场景4｜对方冷淡\n❌ 加倍付出。\n✅「我感觉到你在退后，我不想猜，你能告诉我怎么了吗？」\n\n场景5｜你想拒绝\n❌ 勉强答应。\n✅「这次我可能帮不上，我不想答应了又做不好。」\n\n场景6｜谈未来\n❌「都听你的。」\n✅「我希望我们的未来里，也有我想要的部分。」\n\n场景7｜道歉\n❌「对不起，都是我的错。」\n✅「这件事我有做得不好的地方，但我也想说说我的感受。」\n\n场景8｜接受照顾\n❌「不用不用，我自己来。」\n✅「好啊，谢谢你，我很需要。」\n\n【万能句】「我也可以被照顾，这不是麻烦。」", "scenarioPractice": "场景 A｜ta 心情不好，你想帮但帮不上\n你可能会：一直追问、想办法逗 ta 开心，最后自己也很累。\n更好的做法：「我不逼你说，我就在这儿。你想说的时候我都在。」\n\n场景 B｜你累到不想说话，但 ta 还在等你照顾\n你可能会：硬撑，然后突然爆发。\n更好的做法：「我今天电量很低，不是不爱你。让我充会儿电，晚点我找你。」\n\n场景 C｜朋友总是找你倒情绪垃圾\n你可能会：每次都接，最后自己崩溃。\n更好的做法：「我愿意听，但我今天状态不太好，我们明天聊好吗？」", "loveTimeline": "0-1 个月｜舒适期\n你让 ta 觉得很舒服，关系升温快。关键动作：别一开始就把自己放到最后，早点让 ta 知道你的边界。\n\n2-3 个月｜失衡期\n你付出越来越多，ta 可能习以为常。关键动作：开始接受，而不是只给。\n\n3-6 个月｜委屈期\n你累积的情绪可能一次性爆发，把对方吓到。关键动作：在小事上就说出来，别攒。\n\n6-12 个月｜平衡期\n你学会接受照顾，关系才真正对等。关键动作：每周留一个「被照顾」的时刻。\n\n1 年以后｜长期期\n你们成了彼此的依靠。关键动作：别让「懂事」变成默认，定期确认彼此的需求。\n\n【最大风险】你把自己耗空，然后怪对方不心疼你。", "idealPartner": "【你会被谁吸引】能看见你笑容背后情绪、愿意反过来照顾你的人。ta 不只需要你的温暖，也会主动关心你。你容易被「温柔且有心」的人吸引。\n\n【三个雷区】\n1. 只索取、不回应的人——你会被耗干。\n2. 把你的好当理所当然的人——你会越来越冷。\n3. 情绪黑洞、永远要你哄的人——你会失去自己。\n\n【三个必须】\n1. ta 必须会主动关心你，而不是只接受。\n2. ta 必须能接住你的负面情绪。\n3. ta 必须尊重你的界限，不把你的付出当义务。\n\n【最佳搭配】🌙 小祖宗（细腻能察觉你）、🦋 浪子（不会过度依赖你）", "partnerManual": "ta 总在照顾你。这一次，换你照着做：\n\n1. 她的笑不一定代表没事，请多问一句。\n2. 她习惯照顾人，但她也需要被照顾。\n3. 不要把她做的一切当成理所当然。\n4. 她说「不用」时，可能是怕麻烦你，不是真的不需要。\n5. 她累的时候，请主动接手，而不是等她开口。\n6. 她情绪爆发时，通常已经忍了很久。\n7. 请记得问她：「你今天怎么样？」\n8. 她需要被允许不完美、不开心、不有用。\n9. 不要只在她付出时才看见她。\n10. 你主动一点，她就不用一直撑着。", "compatibility": "高匹配：🌙 小祖宗、🦋 浪子、🌳 保镖\n和 ta 们相处：对方能察觉你的情绪，也不会把你当理所当然。\n\n需要磨合：🐠 小丑（你认真 ta 打哈哈）、🧜‍♀️ 万人迷（你付出 ta 掌控）\n和 ta 们相处：先确认对方是否愿意对等付出，再决定投入。\n\n容易互相消耗：🔥 仆人（两个人都爱给，没人敢要）、🌹 公主病（你哄 ta，ta 试探你）\n和 ta 们相处：练习接受，也练习说出需求。", "redFlags": "你总替别人找理由，这次先替自己数一数。3 条以上，请认真看：\n1. ta 只在需要你的时候找你。\n2. ta 从不问你「你今天怎么样」。\n3. ta 把你的付出当理所当然。\n4. ta 情绪不好就冲你发火。\n5. ta 从不照顾你的感受。\n6. ta 让你觉得「我不够好」。\n7. ta 需要你一直哄，却从不哄你。\n8. ta 阻止你拒绝。\n9. ta 让你越来越累。\n10. 你在这段关系里，一直在给，却很少被接住。", "growthPlan": "第 1 周｜说出一次「不」\n· 拒绝一件你其实不想做的请求。\n· 记录 3 次「我明明不想却答应了」的时刻。\n· 每天问自己一次：「我现在想要什么？」\n\n第 2 周｜练习被照顾\n· 让 ta 为你安排一次约会，不插手、不纠正。\n· 接受一次帮助，只说「谢谢」，不立刻回报。\n· 写下 3 个「我值得被照顾」的理由。\n\n第 3 周｜表达情绪\n· 每天说一句真实的感受，包括不开心。\n· 把「我没事」换成「我有点难过，因为 XX」。\n· 允许自己在别人面前哭一次。\n\n第 4 周｜建立界限\n· 写下你最希望 ta 做的 3 件事，直接告诉 ta。\n· 和 ta 约定：你的付出不是义务。\n· 回顾：这周我把自己放在第几位？\n\n【每周复盘】这周我照顾了谁？谁照顾了我？", "yearPlan": "第 1-3 个月｜学会接受\n目标：每周至少一次，坦然接受别人的照顾。\n\n第 4-6 个月｜建立界限\n目标：对不舒服的请求说「不」，不解释太多。\n\n第 7-9 个月｜表达负面\n目标：让身边的人知道，你也会累、也会难过。\n\n第 10-12 个月｜对等相爱\n目标：从「我为你做什么」变成「我们互相照顾」。", "letterToFuture": "给 6 个月后，也被人好好照顾的你：\n\n希望你不再用「我没事」把所有人挡在外面。\n\n希望你遇到一个会问你「你今天怎么样」的人，也希望你学会在累的时候说「我需要你」。\n\n你不需要一直当太阳。你也可以阴天，也可以下雨，也值得有人为你撑伞。\n\n你值得被照顾，不是因为你做了什么。", "theoryNote": "本报告参考：Bowen 家庭系统理论、Gary Chapman《爱的五种语言》、Marshall Rosenberg 非暴力沟通。"};
    personalities.rose.fullReport = {"corePortrait": "你的核心剧本是「先说不要，才不会失望」。\n\n【核心渴望】被坚定地选择。你希望有人看穿你的嘴硬，还愿意留下来。\n【核心恐惧】被拒绝、被看轻。你怕自己一旦先认真，就输了。\n【防御机制】反话和试探。你用「随便」「不用了」「你走吧」测试对方会不会真的走。\n【关系角色】你是那个嘴上说不在乎、心里比谁都在乎的人。\n\n别人眼中的你：傲娇、难搞、要求高。\n真实的你：很怕不被珍惜，所以先把自己武装起来。\n\n你不是难搞，你只是不敢先暴露真心。", "originStory": "你的嘴硬，可能来自一个「表达需求会被拒绝或嘲笑」的成长环境。\n\n【家庭剧本】也许你小时候撒娇被说矫情，想要什么被说「不懂事」。也许你见过太主动的人不被珍惜，于是你学会：只要我先说不在乎，就不会显得我很在乎。\n\n【形成的信念】「先认真的人会输。」「我不能让人看出我需要 ta。」「如果我开口要，就显得我很廉价。」\n\n【成年后的投射】你长成了一个很有魅力、也很有距离感的人。你会用玩笑、反话、冷脸保护自己，却希望有人能穿过这些，看到你真正的样子。\n\n你想要的不是赢，是有人愿意不跟你计较输赢。", "attachmentStyle": "你的依恋底色是「焦虑型偏回避」：你既渴望靠近，又害怕先暴露。\n\n【你的依恋雷达】你对「被忽视」和「被比较」极其敏感。对方夸别人一句，你表面无所谓，心里已经酸了。\n\n【被触发时】你会说反话、冷脸、故意刺激对方，看 ta 会不会留下来。\n【安全时】当对方脸皮厚、情绪稳、能看穿你的反话，你会慢慢卸下盔甲，变得很黏、很软。\n\n【走向安全的关键】把「试探」换成「直接说」。你可以要，也可以怕，但不需要用推开对方来验证爱。", "strengthsDeep": "1. 你很有魅力。你知道怎么让人心动，也懂得保持神秘感。\n2. 你其实很专一。一旦认定，你会把对方放在心里很重要的位置。\n3. 你有分寸。你知道什么时候该进、什么时候该退，不会让人难堪。\n4. 你很真实。你不喜欢虚伪，只是习惯用反话包装真心。\n5. 你会为爱的人变得柔软。只要对方值得，你愿意卸下所有防备。", "blindSpots": "1. 你用反话测试爱。测试多了，真心的人也会累。\n2. 你不直接说需求。你希望对方猜中，猜不中你就觉得「ta 不懂我」。\n3. 你嘴硬心软。你说「走吧」，其实想听「我不走」。\n4. 你容易把对方推远。你用冷脸保护自己，却让对方以为你不爱。\n5. 你可能赢了面子，输了关系。", "triggerPoints": "【轻度警报】对方没有秒回\n身体信号：心里一沉、开始刷手机\n内心戏：ta 是不是对我不感兴趣了？\n应对：先做自己的事，别用冷脸回应。等 ta 回了，正常说话。\n\n【中度触发】对方夸别的异性\n身体信号：酸、表面平静、语气变淡\n内心戏：ta 是不是觉得别人比我好？\n应对：直接说「我有点吃醋」，而不是说「挺好的啊」。\n\n【彻底爆发】对方真的顺着你的反话说「那就算了吧」\n身体信号：又气又委屈、想哭、想说更狠的话\n内心戏：ta 果然不懂我，果然会走。\n应对：先停 10 秒，把反话翻译成真话。「我不是想让你走，我是想让你哄我。」\n\n【事后修复】告诉对方：「我说反话的时候，其实是在害怕。你可以抱抱我吗？」", "conflictPattern": "【阶段一 · 升级】你察觉到一点冷淡，开始用反话试探。\n你的内心戏：如果 ta 在乎我，就会听出来。\n你该做的：直接说「我有点不安」，而不是说「随便」。\n不要做：用冷脸等对方猜。\n\n【阶段二 · 爆发】对方没接住，你更委屈，说出更狠的话。\n你的内心戏：ta 果然不懂我。\n你该做的：先停下来，把真正的需求说出来。「我不是要赶你走，我是想你哄哄我。」\n不要做：说「你去找别人吧」。\n\n【阶段三 · 僵持】你等对方先低头，对方也拉不下脸。\n你的内心戏：明明是我受伤，凭什么我先开口？\n你该做的：递一个台阶。「我不想吵了，我们和好吧。」\n不要做：用冷战惩罚对方。\n\n【阶段四 · 修复】你想和好，但嘴上还在硬。\n你的内心戏：我不能显得太主动。\n你该做的：说一句软话。「其实我挺怕你真的走的。」\n不要做：和好了又翻旧账。", "communicationGuide": "场景1｜表达需求\n❌「随便你。」\n✅「我想听你的想法，但我也挺想选 XX 的。」\n\n场景2｜表达吃醋\n❌「挺好的啊。」\n✅「我有点吃醋，你哄哄我。」\n\n场景3｜发生冲突\n❌「你去找别人吧。」\n✅「我现在很生气，但我不是想赶你走，我需要你哄哄我。」\n\n场景4｜对方冷淡\n❌ 先冷回去。\n✅「你最近有点远，我不想猜，你能告诉我吗？」\n\n场景5｜你想被挽留\n❌「你走吧。」\n✅「我现在说气话，其实我希望你留下来。」\n\n场景6｜谈未来\n❌「随你便。」\n✅「我希望我们的未来里有我，你愿意和我聊聊吗？」\n\n场景7｜道歉\n❌「行，我错了。」\n✅「我刚才嘴硬了，其实我很在意你，对不起。」\n\n场景8｜拒绝\n❌ 阴阳怪气。\n✅「这件事我不太舒服，我想直接跟你说。」\n\n【万能句】「我说反话的时候，其实是在说：我怕你不爱我。」", "scenarioPractice": "场景 A｜ta 忘了你们的纪念日\n你可能会：冷脸、说「没事」、然后越想越委屈。\n更好的做法：「今天这个日子我期待了很久，你忘了，我有点失落。下次能一起记着吗？」\n\n场景 B｜ta 夸了别的女生好看\n你可能会：阴阳怪气、故意说「那你去找她啊」。\n更好的做法：「我知道你只是随口说，但我有点吃醋。你夸夸我呗。」\n\n场景 C｜你想让 ta 留下来，但嘴上说「你走吧」\n你可能会：真的把 ta 推走，然后自己难过。\n更好的做法：抓住 ta 的手说：「我嘴上说走，心里想让你留。」", "loveTimeline": "0-1 个月｜吸引期\n你魅力全开，但已经开始暗中试探。关键动作：少一点测试，多一点真实。\n\n2-3 个月｜考验期\n你会制造小危机，看 ta 会不会留下来。关键动作：把测试换成直接表达。\n\n3-6 个月｜松动期\n如果 ta 通过了考验，你会慢慢卸下盔甲。关键动作：允许自己示弱。\n\n6-12 个月｜真实期\n你终于敢直接说「我想要」，关系变得轻松。关键动作：保持直接，不要退回反话。\n\n1 年以后｜长期期\n你们学会了彼此的暗号。关键动作：别让「傲娇」变成沟通障碍。\n\n【最大风险】你把真心的人测试走了，然后说「果然没人懂我」。", "idealPartner": "【你会被谁吸引】脸皮厚、情绪稳定、能看穿你反话的人。ta 不会被你的冷脸吓跑，也不会跟你玩猜心游戏。你容易被「稳、厚脸皮、有耐心」的人吸引。\n\n【三个雷区】\n1. 你一试探 ta 就当真、转身走的人——你会后悔。\n2. 玻璃心、需要你一直哄的人——你们会互相消耗。\n3. 不解风情、听不懂暗示的人——你会越来越累。\n\n【三个必须】\n1. ta 必须情绪稳定，不被你的反话带着走。\n2. ta 必须愿意主动，也能看懂你的软。\n3. ta 必须坚定，不会因为一次冷脸就离开。\n\n【最佳搭配】🔥 仆人（热情能融化你）、🌊 管家（稳重能接住你）", "partnerManual": "ta 的刺是软的。请用这 10 条靠近 ta：\n\n1. 她说「随便」时，通常不是真的随便。\n2. 她说「你走吧」时，可能是在等你留下。\n3. 她嘴硬，但心很软。别跟她比谁更冷。\n4. 她吃醋时，需要的是哄，不是讲道理。\n5. 不要在她试探时真的转身走，她会记很久。\n6. 她需要你主动，但不要戳穿她的骄傲。\n7. 她示弱的时候，请认真接住。\n8. 她不喜欢被比较，也不喜欢被忽视。\n9. 她一旦认定，会非常专一。\n10. 你厚脸皮一点，她就会软下来。", "compatibility": "高匹配：🔥 仆人、🌊 管家、☀️ 妈妈\n和 ta 们相处：对方稳、暖、脸皮厚，能接住你的反话。\n\n需要磨合：🦋 浪子（你试探 ta 真走）、🏔️ 军师（不吃情绪价值这套）\n和 ta 们相处：减少试探，直接说需求。\n\n容易互相消耗：🌙 小祖宗（都在等对方证明）、🧜‍♀️ 万人迷（两个人都要赢）\n和 ta 们相处：先约定「不玩猜心」，谁有需求谁直接说。", "redFlags": "你可以嘴硬，但别对自己嘴硬。3 条以上，就该警醒了：\n1. ta 在你试探时真的转身走。\n2. ta 从不主动哄你。\n3. ta 拿你和别人比较。\n4. ta 觉得你的情绪是「无理取闹」。\n5. ta 只享受你的好，不愿付出。\n6. ta 让你不敢说真话。\n7. ta 用冷暴力回应你的不安。\n8. ta 从不给你明确的确认。\n9. ta 让你越来越没有安全感。\n10. 你在这段关系里，一直在演，不能做自己。", "growthPlan": "第 1 周｜抓住反话\n· 每次说「随便/不用/你走吧」，立刻记下来。\n· 记录 3 次「我其实想要但没说」的时刻。\n· 每天把一句反话翻译成真话。\n\n第 2 周｜直接表达\n· 把「随便」换成「我想要 XX」。\n· 把「你走吧」换成「我希望你留下」。\n· 说一次「我吃醋了」，不阴阳怪气。\n\n第 3 周｜允许脆弱\n· 在对方面前说一次「我其实很怕你离开」。\n· 接受一次对方的哄，不嘴硬。\n· 写下 3 个「我可以直接要」的理由。\n\n第 4 周｜停止测试\n· 想试探时，改成问「你现在还喜欢我吗？」\n· 和 ta 约定：不用反话沟通。\n· 回顾：这周我有几次用推开代替靠近？\n\n【每周复盘】这周我说的哪句话，其实是反话？", "yearPlan": "第 1-3 个月｜减少试探\n目标：每次想说反话时，先停 3 秒。\n\n第 4-6 个月｜练习直接\n目标：把需求说出口，不用对方猜。\n\n第 7-9 个月｜允许脆弱\n目标：在对方面前展现真实的软，而不是盔甲。\n\n第 10-12 个月｜松弛被爱\n目标：从「我要赢」变成「我们可以都赢」。", "letterToFuture": "给 6 个月后，敢直接说「我要」的你：\n\n希望你不再用「你走吧」来测试爱。\n\n希望你遇到一个看穿你嘴硬、还愿意留下来的人，也希望你慢慢敢直接说「我想要你」。\n\n你的骄傲保护过你，但在爱里，偶尔放下一点，不会让你输。\n\n你值得被坚定地选择。", "theoryNote": "本报告参考：Ainsworth 依恋类型研究、Susan Forward《原生家庭》、Marshall Rosenberg 非暴力沟通。"};
    personalities.fox.fullReport = {"corePortrait": "你的核心剧本是「只要我不被看透，就不会被伤害」。\n\n【核心渴望】被看见，也被接纳。你希望有人喜欢的是真实的你，而不是你演出来的样子。\n【核心恐惧】被定义、被拆穿。你怕真实的自己不够好，也怕被贴上标签后再也逃不掉。\n【防御机制】切换角色。你可以是深情的、洒脱的、有趣的、冷漠的，取决于对方想看什么。\n【关系角色】你是关系里的演员，也是那个在后台不知道「我到底是谁」的人。\n\n别人眼中的你：多变、神秘、有魅力，永远猜不透。\n真实的你：还没确定哪一个自己才是安全的。\n\n你的多变不是虚伪，是你还在寻找一个可以不用演的地方。", "originStory": "你的多变，可能来自一个「真实的你不够被接纳」的成长环境。\n\n【家庭剧本】也许你被贴过太多标签：「你就是不听话」「你就是想太多」「你就是不如别人」。也许你发现，只要演成大人期待的样子，就能得到喜欢、避免冲突。于是你学会了切换角色，却慢慢忘了自己原本想要什么。\n\n【形成的信念】「真实的我不会被喜欢。」「只要我演得好，就不会被伤害。」「我不能让人看透我。」\n\n【成年后的投射】你长成了一个很有魅力、也很会读空气的人。你知道在什么场合说什么话，也知道怎么让对方喜欢你。但夜深人静时，你可能会突然不知道：刚才那个我，是真的吗？\n\n你不是没有真心，你只是把真心藏得太深。", "attachmentStyle": "你的依恋底色是「焦虑-回避混合」：你渴望亲密，又害怕被看透。\n\n【你的依恋雷达】你对「被要求确定」极其敏感。对方一句「你到底怎么想的」，你就会想逃。\n\n【被触发时】你会切换角色：变得冷淡、变得搞笑、变得无所谓，用另一张脸把问题挡回去。\n【安全时】当对方不急着定义你、允许你变化、也愿意接住你的混乱，你会慢慢卸妆。\n\n【走向安全的关键】把「被看见」和「被伤害」分开。你不需要一次交出全部的自己，但你需要至少让一个人看到真实的你。", "strengthsDeep": "1. 你很有魅力。你知道怎么让气氛变好，也知道怎么让对方心动。\n2. 你适应力强。不同的人、不同的场合，你都能找到合适的相处方式。\n3. 你有创造力。你的脑子里有很多有趣的想法，和你在一起不会无聊。\n4. 你很会共情。你能快速读懂对方的情绪，并且给出恰当的回应。\n5. 你其实很深情。只是你不太敢让这份深情见光。", "blindSpots": "1. 你演得太久，自己也不知道哪个是真的。\n2. 你用变化逃避承诺。每次关系要深入，你就换一副面孔。\n3. 你不让对方看透，对方也无法真正靠近。\n4. 你容易让伴侣没有安全感。ta 不知道今天的你，明天还在不在。\n5. 你可能错过真正懂你的人。因为 ta 还没走近，你就先换了角色。", "triggerPoints": "【轻度警报】对方要求你「给个准话」\n身体信号：想逃、想转移话题、开始说模棱两可的话\n内心戏：我自己都还没想清楚。\n应对：给一个诚实的模糊。「我还在想，给我一点时间，但我在意你。」\n\n【中度触发】对方说「我怎么越来越不懂你了」\n身体信号：心慌、想笑、想用玩笑带过\n内心戏：被发现了。\n应对：不演，给一句真话。「我有时候也不知道自己在想什么，但我愿意跟你说。」\n\n【彻底爆发】对方拆穿你、给你贴标签、逼你承认「你就是这样的人」\n身体信号：防御、愤怒、想消失\n内心戏：你根本不了解我，凭什么定义我？\n应对：先离开，等情绪稳定后说：「你可以不理解我，但请不要替我下结论。」\n\n【事后修复】告诉对方：「我刚才演了一下，是因为我害怕。现在我想真实一点。」", "conflictPattern": "【阶段一 · 升级】对方提出确定性的要求，你觉得被逼到角落，开始打太极。\n你的内心戏：我不能被抓住。\n你该做的：说出你的不确定。「我还没想好，但我不想骗你。」\n不要做：用玩笑糊弄过去。\n\n【阶段二 · 爆发】对方越逼，你越演，最后说出伤人的话。\n你的内心戏：只要我先破坏，就不用面对。\n你该做的：停下来，承认情绪。「我现在很乱，我怕说错话。」\n不要做：突然消失、换一副冷漠的脸。\n\n【阶段三 · 僵持】你演一个不在乎的人，对方信了，关系降温。\n你的内心戏：这样也好，安全。\n你该做的：主动说一句真话，哪怕很小。\n不要做：等对方来拆穿你。\n\n【阶段四 · 修复】你想和好，但不知道该用哪张脸。\n你的内心戏：哪个我才是对的？\n你该做的：用最笨的方式说：「我不知道该怎么说，但我不想失去你。」\n不要做：继续演一个「没事的人」。", "communicationGuide": "场景1｜表达需求\n❌「我也不知道。」\n✅「我还在想，给我一点时间，但我在意你。」\n\n场景2｜表达混乱\n❌ 用玩笑带过。\n✅「我现在有点乱，说不清楚，但我想让你知道真实的我。」\n\n场景3｜对方吃醋\n❌ 故意让 ta 更吃醋。\n✅「我喜欢被你在意，但我不会拿这个试探你。」\n\n场景4｜对方冷淡\n❌ 立刻换一副面孔。\n✅「你最近有点远，我不想演，我想知道真实的情况。」\n\n场景5｜你想独处\n❌ 突然消失。\n✅「我需要一点时间整理自己，不是要离开你。」\n\n场景6｜谈未来\n❌「以后再说。」\n✅「我对未来还没想清楚，但我愿意和你一起想。」\n\n场景7｜道歉\n❌ 用幽默化解。\n✅「我刚才用玩笑躲过去了，其实我想认真跟你道歉。」\n\n场景8｜拒绝\n❌ 演一个「都可以」的人。\n✅「这件事我不想，我想直接告诉你。」\n\n【万能句】「我不想演了，我想让你认识真正的我。」", "scenarioPractice": "场景 A｜ta 问「你到底喜欢我什么」\n你可能会：说一堆好听的，但自己都不信。\n更好的做法：说一个具体的、真实的细节。「我喜欢你在我乱的时候不催我。」\n\n场景 B｜你在聚会上自动切换成「社交模式」\n你可能会：回家后觉得空虚，不知道自己是谁。\n更好的做法：回家后写下三个「今天我真实感受到的瞬间」。\n\n场景 C｜ta 说「我觉得你不真实」\n你可能会：立刻防御、演得更厉害。\n更好的做法：「你说得对，我有时候会演。给我一点时间，我想对你真实。」", "loveTimeline": "0-1 个月｜高光期\n你展现最有魅力的一面，对方很容易上头。关键动作：早一点露出一点真实，别把期待拉太满。\n\n2-3 个月｜混乱期\n你开始展现不同面貌，对方困惑，你也在找自己。关键动作：告诉对方「我在找自己，不是耍你」。\n\n3-6 个月｜选择期\n如果你还愿意留在 ta 身边，说明 ta 对你很重要。关键动作：少换角色，多给稳定。\n\n6-12 个月｜落地期\n你才愿意卸妆，展现最不加修饰的自己。关键动作：允许对方看到你的无聊、脆弱、普通。\n\n1 年以后｜长期期\n你终于可以在一个人面前不用演。关键动作：珍惜这个能让你真实的人。\n\n【最大风险】你演得太好，把真正想靠近你的人也骗走了。", "idealPartner": "【你会被谁吸引】好奇心强、不控制、能欣赏你多变的人。ta 不急着定义你，但会在你迷茫时给你方向。你容易被「稳、有趣、不评判」的人吸引。\n\n【三个雷区】\n1. 控制欲强、要求你「稳定一点」的人——你会窒息。\n2. 喜欢给你贴标签、下定义的人——你会防御。\n3. 只能接受你某一面的人——你会一直演。\n\n【三个必须】\n1. ta 必须允许你变化，不急着把你归类。\n2. ta 必须有稳定的内核，能接住你的混乱。\n3. ta 必须喜欢真实的你，而不只是你演出来的样子。\n\n【最佳搭配】🏔️ 军师（理性包容）、🧜‍♀️ 万人迷（同样有魅力）", "partnerManual": "ta 有很多张脸，但只有一颗心。请这样对 ta：\n\n1. 他多变，不是不爱你，是他还在找自己。\n2. 不要逼他立刻给答案，越逼他越演。\n3. 他演的时候，别拆穿，给他一个安全的出口。\n4. 他需要你稳定，但不需要你控制。\n5. 他开玩笑时，可能是在说真心话。\n6. 不要给他贴标签，他会立刻防御。\n7. 他愿意在你面前无聊，说明他很信任你。\n8. 他需要被看见，而不是被定义。\n9. 他其实很怕被抛弃，只是不说。\n10. 你越接纳他的全部，他越不需要演。", "compatibility": "高匹配：🏔️ 军师、🧜‍♀️ 万人迷、🦋 浪子\n和 ta 们相处：对方不急着定义你，也接得住你的变化。\n\n需要磨合：🌳 保镖（太求稳定）、🌙 小祖宗（需要高频确认）\n和 ta 们相处：提前说清楚你的不确定，别让对方用猜测填补。\n\n容易互相消耗：🌹 公主病（都在试探）、🐠 小丑（都用表演逃避）\n和 ta 们相处：约定「至少一个人先说真话」。", "redFlags": "别演了，诚实数一遍。超过 3 条，这段关系已经在消耗你：\n1. ta 逼你立刻定义关系。\n2. ta 给你贴标签、下结论。\n3. ta 只喜欢你某一面。\n4. ta 不允许你变化。\n5. ta 拆穿你时带着羞辱。\n6. ta 让你不敢说真话。\n7. ta 需要你一直演。\n8. ta 从不接纳你的混乱。\n9. ta 让你越来越不知道自己是谁。\n10. 你在这段关系里，一直在演，从未落地。", "growthPlan": "第 1 周｜记录角色\n· 写下你在不同人面前扮演的样子，找出共同点。\n· 记录 3 次「我在演」的时刻。\n· 每天问自己一次：「我现在真实的感受是什么？」\n\n第 2 周｜说一句真话\n· 每天对 ta 说一句不加修饰的真实感受。\n· 不用玩笑带过一次认真。\n· 说一次「我不知道，但我很难受」。\n\n第 3 周｜允许无聊\n· 和 ta 待一次不安排、不表演的普通夜晚。\n· 做一件不需要被看见的事。\n· 接受自己「不有趣」的一面。\n\n第 4 周｜定义自己\n· 写下「不管怎么变，我都不会放弃的 3 件事」。\n· 和 ta 聊一次真实的自己。\n· 回顾：这周我有几次卸下了面具？\n\n【每周复盘】这周哪一个瞬间，我是真实的？", "yearPlan": "第 1-3 个月｜看见面具\n目标：识别自己最常用的三张面具。\n\n第 4-6 个月｜练习真实\n目标：每天至少一次，不用演。\n\n第 7-9 个月｜整合自我\n目标：接受自己可以同时是多面的，但有一个稳定的内核。\n\n第 10-12 个月｜被看见\n目标：让一个人真正认识你，并且留下来。", "letterToFuture": "给 6 个月后，卸了妆也安心的你：\n\n希望你不再需要靠「演」来获得喜欢。\n\n希望你遇到一个人，ta 见过你的无聊、你的混乱、你的普通，还愿意留下。\n\n你可以是多面的，但你不必再躲。\n\n真实比完美更有吸引力，被看见也不会让你失去自由。", "theoryNote": "本报告参考：Bowlby 依恋理论、荣格「人格面具」概念、Brené Brown 关于真实与脆弱的研究。"};
    personalities.eagle.fullReport = {"corePortrait": "你的核心剧本是「先确认值得，再投入感情」。\n\n【核心渴望】被理解，也被尊重。你希望有人懂你的野心，也能接住你的脆弱。\n【核心恐惧】失控和低效。你怕投入一段没有结果的关系，也怕自己变得情绪化。\n【防御机制】分析和标准。你用清单、逻辑、评估，把感情变成一个可以掌控的项目。\n【关系角色】你是关系里的军师，习惯给方案，不习惯说感受。\n\n别人眼中的你：理性、清醒、有主见，好像什么都能搞定。\n真实的你：不太知道怎么表达爱，也不太敢承认自己需要人陪。\n\n你不是冷血，你只是把感受关得太久。", "originStory": "你的理性，可能来自一个「情绪不被允许」的成长环境。\n\n【家庭剧本】也许你从小就被要求懂事、优秀、争气。难过被说成矫情，脆弱被说成没用。你发现，只有拿出成绩、讲出道理，才能得到认可。\n\n【形成的信念】「情绪解决不了问题。」「我必须足够优秀，才值得被爱。」「先动心的人会失控。」\n\n【成年后的投射】你长成了一个很能扛事的人：遇事先分析，受伤先忍住。你习惯用头脑处理一切，包括感情。你以为只要足够理性，就不会受伤。\n\n但爱不是一道可以算对的题。", "attachmentStyle": "你的依恋底色是「回避型偏安全」：你相信自己的能力，但不太相信关系能承受真实的你。\n\n【你的依恋雷达】你对「情绪化」和「不确定」很敏感。对方一哭一闹，你的第一反应是「怎么解决」。\n\n【被触发时】你会讲道理、给方案、拉开距离，用理性把情绪挡在外面。\n【安全时】当对方稳定、独立、能和你平等对话，你会慢慢放松，甚至露出孩子气的一面。\n\n【走向安全的关键】把「解决问题」和「陪伴情绪」分开。很多时候，对方要的不是答案，是你在。", "strengthsDeep": "1. 你可靠。遇到问题，你不会慌，你能给出清晰的判断和方案。\n2. 你有目标感。你知道自己要什么，也会为未来做规划。\n3. 你尊重对方。你不会控制、不会查岗，你相信成年人应该有自己的空间。\n4. 你忠诚。你不轻易开始，但一旦认定，会很认真。\n5. 你能让人成长。你会推着对方变得更好，也会在关键时刻给出真话。", "blindSpots": "1. 你用理性回避情绪。对方要的是安慰，你给的是分析。\n2. 你的标准太高。你总在评估「合不合适」，却忘了感情需要投入。\n3. 你不擅长表达爱。你心里有，但对方感受不到。\n4. 你容易显得冷漠。你以为的「冷静」，在对方眼里是「不在乎」。\n5. 你可能错过「不在清单里」的人。最合适的，往往不是你想象的样子。", "triggerPoints": "【轻度警报】对方情绪化、说话没逻辑\n身体信号：不耐烦、想纠正、开始讲道理\n内心戏：这样解决不了问题。\n应对：先问一句「你现在是想让我听，还是想让我给建议？」\n\n【中度触发】对方没有规划、走一步看一步\n身体信号：焦虑、想掌控、开始评估这段关系\n内心戏：这样下去没有未来。\n应对：说出你的担心，而不是直接下结论。「我需要一点确定感，我们能聊聊计划吗？」\n\n【彻底爆发】对方说「你根本不爱我，你只爱你自己」\n身体信号：震惊、委屈、想反驳\n内心戏：我做了这么多，你怎么能这么说？\n应对：先别辩解，问一句「你是什么时候开始这么觉得的？」\n\n【事后修复】告诉对方：「我不太会表达，但我不是不在乎。你告诉我，你需要我怎么做。」", "conflictPattern": "【阶段一 · 升级】对方表达情绪，你开始分析对错。\n你的内心戏：只要讲清楚道理，问题就解决了。\n你该做的：先接情绪。「我听出来你很难过，我们先不急着解决。」\n不要做：打断对方、纠正逻辑。\n\n【阶段二 · 爆发】对方越说越激动，你觉得无理取闹，语气变冷。\n你的内心戏：这样沟通没有意义。\n你该做的：停下来，承认自己也有情绪。「我现在也有点急，我们先冷静十分钟。」\n不要做：甩一句「你冷静了再说」。\n\n【阶段三 · 僵持】你用沉默和距离处理，对方觉得被冷暴力。\n你的内心戏：我需要空间想清楚。\n你该做的：说明你的方式。「我需要想一下，不是不理你，晚点我给你答复。」\n不要做：消失。\n\n【阶段四 · 修复】你想和好，但开口又变成讲道理。\n你的内心戏：我已经分析得很清楚了，ta 应该明白。\n你该做的：先说感受，再说方案。「我刚才有点急，对不起。我们一起来看看怎么办。」\n不要做：把道歉变成辩论。", "communicationGuide": "场景1｜表达需求\n❌「你这样不对。」\n✅「我理解你的感受，但我有另一个角度，你愿意听吗？」\n\n场景2｜表达关心\n❌ 直接给方案。\n✅「你想让我听，还是想让我一起想办法？」\n\n场景3｜对方吃醋\n❌ 觉得无理取闹。\n✅「我可能没注意到你的感受，你告诉我你在担心什么。」\n\n场景4｜对方冷淡\n❌ 冷静分析后直接下结论。\n✅「我不想猜，我想听你说，哪怕说得不完美。」\n\n场景5｜你想独处\n❌ 突然消失。\n✅「我需要一点时间整理思路，晚点我找你。」\n\n场景6｜谈未来\n❌ 列一张条件清单。\n✅「我希望我们有共同的方向，你希望的未来是什么样的？」\n\n场景7｜道歉\n❌「从逻辑上说，我确实有不对的地方。」\n✅「我刚才只顾着讲道理，忽略了你的感受，对不起。」\n\n场景8｜拒绝\n❌ 用理性论证对方不合理。\n✅「这件事我不想做，不是你不讲理，是我有自己的考虑。」\n\n【万能句】「我先不解决问题，我想先陪着你。」", "scenarioPractice": "场景 A｜ta 哭着说工作受委屈\n你可能会：分析问题、给建议，对方越听越气。\n更好的做法：先递纸巾。「先不聊怎么解决，你想骂就骂，我听着。」\n\n场景 B｜ta 说「我们未来怎么办」\n你可能会：开始列计划、算成本。\n更好的做法：先问「你最担心的是什么？」再一起讨论。\n\n场景 C｜你发现自己又在心里给 ta 打分\n你可能会：越打越低，然后想分手。\n更好的做法：停下来问自己：「我是在评估 ta，还是在害怕投入？」", "loveTimeline": "0-1 个月｜评估期\n你在心里给 ta 打分，看 ta 是否「合格」。关键动作：别只看条件，也看相处时的感受。\n\n2-3 个月｜确认期\n如果 ta 通过标准，你会开始认真投入。关键动作：告诉 ta 你的认真，而不是让 ta 猜。\n\n3-6 个月｜冲突期\n你可能会发现 ta 不符合某个标准，内心反复权衡。关键动作：区分「原则问题」和「习惯差异」。\n\n6-12 个月｜融合期\n你学会把「标准」放下一点，让感情进来。关键动作：允许对方不完美。\n\n1 年以后｜长期期\n你们成为彼此的后盾。关键动作：别让关系变成项目管理，记得留一点浪漫。\n\n【最大风险】你用「不合适」解释一切，其实是不敢投入。", "idealPartner": "【你会被谁吸引】同样优秀、有独立思想、能和你并肩的人。ta 不需要你低头，也不需要你哄，但能接住你的理性。你容易被「聪明、稳定、有边界」的人吸引。\n\n【三个雷区】\n1. 极度情绪化、天天要你哄的人——你会累。\n2. 没有目标、浑浑噩噩的人——你会失去耐心。\n3. 试图控制你、干涉你事业的人——你会立刻退。\n\n【三个必须】\n1. ta 必须有独立的思想和生活。\n2. ta 必须能直接沟通，不玩猜心。\n3. ta 必须接受你的理性，也能带你回到感受。\n\n【最佳搭配】🦋 浪子（独立）、🌊 管家（深沉有思想）", "partnerManual": "ta 习惯用脑谈恋爱。这份说明帮你走进 ta 的心：\n\n1. 他不是不爱你，他只是不太会说。\n2. 他给建议时，是在表达关心，不是否定你。\n3. 他需要你直接说需求，不要让他猜。\n4. 他冷静的时候，不一定是不在乎，可能是在处理信息。\n5. 不要用情绪逼他表态，他会退。\n6. 他尊重你的空间，也请你尊重他的。\n7. 他愿意为你调整，但请给他时间。\n8. 他其实很怕自己不够好。\n9. 他需要被肯定，而不只是被需要。\n10. 你教他表达，他会学得很快。", "compatibility": "高匹配：🦋 浪子、🌊 管家、🧜‍♀️ 万人迷\n和 ta 们相处：对方独立、有边界，你们能并肩。\n\n需要磨合：🌙 小祖宗（需要情绪回应）、🔥 仆人（节奏太快）\n和 ta 们相处：先接情绪，再给方案。\n\n容易互相消耗：🌹 公主病（你要逻辑 ta 要态度）、🐠 小丑（你觉得不认真）\n和 ta 们相处：别用理性压对方，也别把玩笑当全部。", "redFlags": "做一次冷静的风险评估：以下命中 3 条以上，建议重新审视关系：\n1. ta 要求你放弃事业或目标。\n2. ta 用情绪逼你做决定。\n3. ta 从不直接沟通，只让你猜。\n4. ta 否定你的理性，说你冷血。\n5. ta 不尊重你的时间。\n6. ta 没有自己的目标，全靠你。\n7. ta 让你越来越情绪化。\n8. ta 把关系变成一场考试。\n9. ta 让你不敢表达真实想法。\n10. 你在这段关系里，一直在评估，从未真正投入。", "growthPlan": "第 1 周｜先感受\n· 每天问自己一次「我现在的情绪是什么」，不分析原因。\n· 记录 3 次「我用讲道理回避情绪」的时刻。\n· 对一个人说「我今天有点难过」，不解释。\n\n第 2 周｜少给方案\n· ta 倾诉时，先听完，不急着给建议。\n· 每天问一次「你想让我听，还是想办法？」\n· 练习说「我不知道」，而不是编一个答案。\n\n第 3 周｜表达喜欢\n· 每天说一句具体的欣赏，不用讲道理。\n· 做一件没有目的的小事。\n· 说一次「我需要你」。\n\n第 4 周｜允许失控\n· 做一件没有计划、纯粹为了开心的事。\n· 和 ta 聊一次你的害怕。\n· 回顾：这周我有几次先接住了情绪？\n\n【每周复盘】这周我有没有把「对」看得比「靠近」更重要？", "yearPlan": "第 1-3 个月｜练习感受\n目标：每天识别一次情绪，不急着分析。\n\n第 4-6 个月｜练习陪伴\n目标：对方倾诉时，先听 5 分钟再回应。\n\n第 7-9 个月｜放下标准\n目标：允许伴侣有不完美的地方。\n\n第 10-12 个月｜投入\n目标：从「评估」变成「选择并承担」。", "letterToFuture": "给 6 个月后，允许自己失控一次的你：\n\n希望你不再用「合不合适」把所有人挡在门外。\n\n希望你遇到一个既让你欣赏、也让你敢脆弱的人。\n\n你的理性保护过你，但在爱里，偶尔放下一点控制，不会让你输。\n\n在爱里，正确不如靠近。", "theoryNote": "本报告参考：John Gottman 伴侣冲突研究、Marshall Rosenberg 非暴力沟通、Sue Johnson 情绪取向疗法（EFT）。"};

n· 为自己安排一次不需要 ta 参与的仪式感。\n· 做一件让自己开心的小事。\n· 写下 3 个「我一个人也可以很好」的理由。\n\n第 3 周｜看行动\n· 记录 ta 为你做的小事，而不只是说了什么。\n· 把「ta 不浪漫」和「ta 不爱我」分开。\n· 直接说出一个具体期待。\n\n第 4 周｜接受平淡\n· 和 ta 过一个不特别但舒服的普通周末。\n· 和 ta 聊一次现实和浪漫的平衡。\n· 回顾：这周我有几次用期待惩罚对方？\n\n【每周复盘】这周我爱的是真实的 ta，还是我想象的 ta？", "yearPlan": "第 1-3 个月｜看见真实\n目标：接受 ta 的普通，不急着换人。\n\n第 4-6 个月｜表达期待\n目标：把「你应该懂」换成具体请求。\n\n第 7-9 个月｜创造浪漫\n目标：和 ta 一起建立属于你们的仪式。\n\n第 10-12 个月｜长期浪漫\n目标：在平淡里继续制造心动。", "letterToFuture": "给 6 个月后，爱得不那么用力的你：\n\n希望你不再用童话的标准要求现实的人。\n\n希望你遇到一个愿意为你花心思的人，也希望你学会爱真实的 ta，而不是你想象中的 ta。\n\n浪漫很重要，但愿意留下来一起过日子的人，更珍贵。\n\n你值得被认真对待，也值得被真实地爱。", "theoryNote": "本报告参考：Sue Johnson 情绪取向疗法（EFT）、Dorothy Tennov 关于 limerence 的研究、Gary Chapman《爱的五种语言》。"};
    personalities.clownfish.fullReport = {"corePortrait": "你的核心剧本是「只要我一直在笑，就没人会发现我有多怕」。\n\n【核心渴望】被看见，也被认真对待。你希望有人能穿过你的玩笑，看到你真正的在意。\n【核心恐惧】被拒绝、被看轻。你怕自己一旦认真，就会显得可笑。\n【防御机制】幽默。你用搞笑表达真心，用「无所谓」掩饰在意。\n【关系角色】你是关系里的开心果，也是那个把真心藏在笑话里的人。\n\n别人眼中的你：幽默、好相处、没心没肺。\n真实的你：很怕被拒绝，所以先把自己变成玩笑。\n\n你不是不认真，你只是不敢认真。", "originStory": "你的幽默，可能是一种生存策略。\n\n【家庭剧本】也许小时候你发现，搞笑能让气氛变好、能让大人注意到你；也许你见过认真表达却被嘲笑的人。于是你学会把真心包在笑话里，既表达了，又不用承担被拒绝的风险。\n\n【形成的信念】「认真就输了。」「只要我在笑，就不会被伤害。」「没人会认真对待一个搞笑的人。」\n\n【成年后的投射】你长成了一个很会活跃气氛的人：有你在就不会冷场，你也能让难过的人笑出来。但你也发现，大家喜欢的是「有趣的你」，很少有人问「你还好吗」。\n\n你值得被认真对待，哪怕你不搞笑。", "attachmentStyle": "你的依恋底色是「焦虑型偏回避」：你渴望被认真看见，又害怕暴露真心。\n\n【你的依恋雷达】你对「气氛变冷」和「被认真追问」很敏感。对方一认真，你就想打哈哈。\n\n【被触发时】你会讲笑话、转移话题、用自嘲把真心盖过去。\n【安全时】当对方能接住你的玩笑、也愿意认真听你说话，你会慢慢放下防备。\n\n【走向安全的关键】把「认真」和「可笑」分开。你可以在开玩笑之后补一句「其实我是认真的」，这不会让你显得廉价。", "strengthsDeep": "1. 你有幽默感。你能让关系轻松，也能在尴尬时救场。\n2. 你情商高。你能快速读懂气氛，知道什么时候该说什么。\n3. 你善良。你常常用玩笑化解别人的难堪。\n4. 你其实很细腻。你记得别人的喜好，只是不常说。\n5. 你有趣。和你在一起，生活不会无聊。", "blindSpots": "1. 你用玩笑逃避认真。对方永远不知道你真正的想法。\n2. 你不敢表达需求。你怕被拒绝，所以先说「我无所谓」。\n3. 你容易被当成「只是朋友」。因为你从不让人看到你的在意。\n4. 你难过时没人发现。因为你太会笑了。\n5. 你可能错过认真的人。因为 ta 以为你不想认真。", "triggerPoints": "【轻度警报】对方认真追问你的想法\n身体信号：紧张、想笑、想转移话题\n内心戏：被看穿了。\n应对：停一下，说一句「其实我是认真的」。\n\n【中度触发】对方看穿你的玩笑、追问「你是不是在逃避」\n身体信号：尴尬、想逃、想用更大的玩笑盖过去\n内心戏：别问了，我不想暴露。\n应对：承认一点。「你说得对，我有点在逃。给我一点时间。」\n\n【彻底爆发】对方说「你从来不肯认真」\n身体信号：受伤、沉默、想消失\n内心戏：我其实很认真，只是不敢。\n应对：告诉对方：「我不是不认真，我是怕认真了被拒绝。」\n\n【事后修复】对对方说：「我刚才又用玩笑躲了，其实我想好好跟你说。」", "conflictPattern": "【阶段一 · 升级】对方提出严肃话题，你开始打哈哈。\n你的内心戏：别这么认真，我受不了。\n你该做的：告诉对方「这个话题对我有点难，但我想认真听」。\n不要做：用玩笑把话题带偏。\n\n【阶段二 · 爆发】对方觉得你不重视，生气，你更想用搞笑缓和。\n你的内心戏：我只是不想吵架。\n你该做的：停下来，认真回应一次。「我知道这件事很重要，我不闹了。」\n不要做：在对方生气时开玩笑。\n\n【阶段三 · 僵持】你用幽默掩饰不安，对方觉得你不在乎。\n你的内心戏：我说不出真心话。\n你该做的：发一条认真的消息，不用长。\n不要做：继续演「没事人」。\n\n【阶段四 · 修复】你想道歉，但又怕太严肃。\n你的内心戏：要不买个礼物、讲个笑话算了。\n你该做的：认真说一次「对不起，我刚才没有认真对待你的感受」。\n不要做：用礼物代替沟通。", "communicationGuide": "场景1｜表达真心\n❌ 用玩笑带过。\n✅「其实我是认真的，我有点紧张，但我想让你知道。」\n\n场景2｜表达需求\n❌「我无所谓。」\n✅「我其实挺想要的，只是不好意思说。」\n\n场景3｜对方吃醋\n❌ 开玩笑刺激 ta。\n✅「我在意你的感受，我不会拿这个开玩笑。」\n\n场景4｜对方冷淡\n❌ 用搞笑掩饰不安。\n✅「你最近有点远，我有点慌，我们能聊聊
