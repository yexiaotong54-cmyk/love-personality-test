<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>你的恋爱人格 | 10道题测出你的恋爱类型</title>
  <meta name="description" content="10道趣味小题，6种恋爱人格，发现你在感情中的真实模样">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #E8A0BF;
      --primary-dark: #D4789C;
      --secondary: #B8E0D2;
      --bg: #FFF8F0;
      --text: #2D2D2D;
      --text-light: #666;
      --card-bg: #FFFFFF;
      --shadow: 0 4px 20px rgba(232, 160, 191, 0.15);
      --radius: 0px;
      --pixel: 4px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      background-image:
        linear-gradient(45deg, #fce4ec 25%, transparent 25%),
        linear-gradient(-45deg, #fce4ec 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #fce4ec 75%),
        linear-gradient(-45deg, transparent 75%, #fce4ec 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px;
      min-height: 100vh;
    }

    /* ========== 像素风标题 ========== */
    .pixel-font {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      letter-spacing: 2px;
      image-rendering: pixelated;
    }

    /* ========== 欢迎页 ========== */
    .welcome-page {
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.6s ease;
    }

    /* 像素爱心 */
    .pixel-heart-wrapper {
      margin-bottom: 32px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pixelBounce 1.5s steps(4) infinite;
    }

    @keyframes pixelBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .pixel-heart {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: transparent;
      box-shadow:
        /* Row 1 */
        12px 0px 0 0 #ff6b9d,
        18px 0px 0 0 #ff6b9d,
        30px 0px 0 0 #ff6b9d,
        36px 0px 0 0 #ff6b9d,
        /* Row 2 */
        6px 6px 0 0 #ff6b9d,
        12px 6px 0 0 #ff8fb5,
        18px 6px 0 0 #ff6b9d,
        24px 6px 0 0 #ff6b9d,
        30px 6px 0 0 #ff8fb5,
        36px 6px 0 0 #ff6b9d,
        42px 6px 0 0 #ff6b9d,
        /* Row 3 */
        6px 12px 0 0 #ff6b9d,
        12px 12px 0 0 #ff8fb5,
        18px 12px 0 0 #ff6b9d,
        24px 12px 0 0 #ff6b9d,
        30px 12px 0 0 #ff6b9d,
        36px 12px 0 0 #ff8fb5,
        42px 12px 0 0 #ff6b9d,
        /* Row 4 */
        12px 18px 0 0 #ff6b9d,
        18px 18px 0 0 #ff6b9d,
        24px 18px 0 0 #ff6b9d,
        30px 18px 0 0 #ff6b9d,
        36px 18px 0 0 #ff6b9d,
        /* Row 5 */
        18px 24px 0 0 #ff6b9d,
        24px 24px 0 0 #ff6b9d,
        30px 24px 0 0 #ff6b9d,
        /* Row 6 */
        24px 30px 0 0 #ff6b9d;
      transform: scale(1.8);
    }

    /* 像素风星星装饰 */
    .pixel-stars {
      position: relative;
      height: 20px;
      margin-bottom: 16px;
    }

    .pixel-star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #FFD700;
      box-shadow:
        4px 0 0 #FFD700,
        -4px 0 0 #FFD700,
        0 4px 0 #FFD700,
        0 -4px 0 #FFD700;
      animation: twinkle 2s steps(2) infinite;
    }

    .pixel-star:nth-child(1) { left: 15%; top: 5px; animation-delay: 0s; }
    .pixel-star:nth-child(2) { left: 45%; top: 0; animation-delay: 0.5s; }
    .pixel-star:nth-child(3) { left: 75%; top: 8px; animation-delay: 1s; }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 12px;
      font-family: 'Courier New', monospace;
      letter-spacing: 4px;
      text-shadow: 3px 3px 0 #ffd1e8, -1px -1px 0 #fff;
    }

    .welcome-subtitle {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 40px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .welcome-features {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 40px;
    }

    .feature-item {
      text-align: center;
    }

    .feature-num {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      font-family: 'Courier New', monospace;
    }

    .feature-label {
      font-size: 12px;
      color: var(--text-light);
      font-family: 'Courier New', monospace;
    }

    .types-preview {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .type-badge {
      background: var(--card-bg);
      padding: 8px 14px;
      border-radius: 0;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      border: 3px solid var(--primary);
      box-shadow: 4px 4px 0 var(--primary);
      transition: all 0.1s steps(2);
    }

    .type-badge:hover {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--primary);
    }

    .start-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 0;
      cursor: pointer;
      transition: all 0.1s steps(2);
      box-shadow: 6px 6px 0 var(--primary-dark);
      font-family: 'Courier New', monospace;
      letter-spacing: 2px;
      border: 3px solid var(--primary-dark);
      image-rendering: pixelated;
    }

    .start-btn:hover {
      transform: translate(3px, 3px);
      box-shadow: 3px 3px 0 var(--primary-dark);
    }

    .start-btn:active {
      transform: translate(6px, 6px);
      box-shadow: 0 0 0 var(--primary-dark);
    }

    /* ========== 测试页 ========== */
    .test-page {
      display: none;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .progress-bar {
      background: #F0E0E8;
      height: 6px;
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .progress-text {
      text-align: right;
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .question-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .question-num {
      font-size: 13px;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      background: #FFF5F8;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background: #FFF0F5;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: linear-gradient(135deg, #FFF0F5, #FFE8EF);
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      gap: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .nav-btn.prev {
      background: #F5F5F5;
      color: var(--text-light);
    }

    .nav-btn.next {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 16px rgba(232, 160, 191, 0.3);
    }

    .nav-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .nav-btn:not(:disabled):active {
      transform: scale(0.98);
    }

    /* ========== 结果页 ========== */
    .result-page {
      display: none;
      animation: fadeIn 0.6s ease;
    }

    .result-header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .result-emoji {
      font-size: 72px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }

    .result-label {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .result-type {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .result-keywords {
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 24px;
    }

    .result-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .result-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    .result-card p {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.7;
    }

    .trait-list {
      list-style: none;
    }

    .trait-list li {
      font-size: 14px;
      padding: 6px 0;
      color: var(--text-light);
    }

    .trait-list li::before {
      margin-right: 8px;
    }

    .strengths li::before { content: "✅"; }
    .weaknesses li::before { content: "⚠️"; }

    .match-section {
      background: linear-gradient(135deg, #FFF5F8, #F0F8FF);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }

    .match-section h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .match-section p {
      font-size: 14px;
      color: var(--text-light);
    }

    .growth-section {
      background: linear-gradient(135deg, #F0FFF8, #F8FFF0);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
    }

    .growth-section h3 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .growth-section p {
      font-size: 14px;
      color: var(--text-light);
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
      margin-bottom: 20px;
    }

    .action-btn {
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 16px rgba(232, 160, 191, 0.3);
    }

    .action-btn.secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--primary);
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* ========== 付费页 ========== */
    .pay-section {
      background: linear-gradient(135deg, #FFF5F8, #FFF0F5);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: center;
      margin-bottom: 16px;
    }

    .pay-section h3 {
      font-size: 18px;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .pay-section .desc {
      font-size: 13px;
      color: var(--text-light);
      margin-bottom: 16px;
    }

    .pay-features {
      text-align: left;
      margin-bottom: 20px;
    }

    .pay-features li {
      font-size: 14px;
      padding: 6px 0;
      list-style: none;
    }

    .pay-features li::before {
      content: "✨ ";
    }

    .price {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 4px;
    }

    .price-unit {
      font-size: 14px;
      color: var(--text-light);
    }

    .original-price {
      text-decoration: line-through;
      color: #ccc;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .pay-btn {
      background: linear-gradient(135deg, #FF6B6B, #FF8E53);
      color: white;
      border: none;
      padding: 16px 48px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 107, 107, 0.3);
      transition: all 0.3s ease;
    }

    .pay-btn:active {
      transform: scale(0.98);
    }

    /* ========== 分享弹窗 ========== */
    .share-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .share-modal.show {
      display: flex;
    }

    .share-content {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 32px 24px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      animation: fadeIn 0.3s ease;
    }

    .share-content h3 {
      margin-bottom: 16px;
    }

    .share-options {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    .share-option {
      text-align: center;
      cursor: pointer;
    }

    .share-option .icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 6px;
    }

    .share-option:nth-child(1) .icon { background: #07C160; }
    .share-option:nth-child(2) .icon { background: #E8A0BF; }
    .share-option:nth-child(3) .icon { background: #FF6B6B; }

    .share-option span {
      font-size: 12px;
      color: var(--text-light);
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 14px;
      color: var(--text-light);
      cursor: pointer;
      padding: 8px;
    }

    /* ========== 底部 ========== */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 欢迎页 -->
    <div class="welcome-page" id="welcomePage">
      <div class="pixel-stars">
        <div class="pixel-star"></div>
        <div class="pixel-star"></div>
        <div class="pixel-star"></div>
      </div>
      <div class="pixel-heart-wrapper">
        <div class="pixel-heart"></div>
      </div>
      <h1 class="welcome-title">你的恋爱人格</h1>
      <p class="welcome-subtitle">10道趣味小题，发现你在感情中的真实模样</p>

      <div class="welcome-features">
        <div class="feature-item">
          <div class="feature-num">10</div>
          <div class="feature-label">道题目</div>
        </div>
        <div class="feature-item">
          <div class="feature-num">2</div>
          <div class="feature-label">分钟</div>
        </div>
        <div class="feature-item">
          <div class="feature-num">6</div>
          <div class="feature-label">种人格</div>
        </div>
      </div>

      <div class="types-preview">
        <span class="type-badge">🦋 自由蝶</span>
        <span class="type-badge">🔥 烈焰鸟</span>
        <span class="type-badge">🌙 月光鹿</span>
        <span class="type-badge">🌊 深海鲸</span>
        <span class="type-badge">☀️ 向日葵</span>
        <span class="type-badge">🌹 带刺玫瑰</span>
      </div>

      <button class="start-btn" onclick="startTest()">开始测试 →</button>
    </div>

    <!-- 测试页 -->
    <div class="test-page" id="testPage">
      <div class="progress-text"><span id="progressNum">1</span>/10</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 10%"></div>
      </div>

      <div class="question-card">
        <div class="question-num" id="questionNum">第1题</div>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn prev" id="prevBtn" onclick="prevQuestion()" disabled>上一题</button>
        <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">下一题</button>
      </div>
    </div>

    <!-- 结果页 -->
    <div class="result-page" id="resultPage"></div>
  </div>

  <!-- 分享弹窗 -->
  <div class="share-modal" id="shareModal">
    <div class="share-content">
      <h3>分享给朋友</h3>
      <div class="share-options">
        <div class="share-option" onclick="shareTo('wechat')">
          <div class="icon">💬</div>
          <span>微信</span>
        </div>
        <div class="share-option" onclick="shareTo('moments')">
          <div class="icon">📷</div>
          <span>朋友圈</span>
        </div>
        <div class="share-option" onclick="shareTo('copy')">
          <div class="icon">🔗</div>
          <span>复制链接</span>
        </div>
      </div>
      <button class="close-modal" onclick="closeShareModal()">关闭</button>
    </div>
  </div>

  <script>
    // ========== 题目数据 ==========
    const questions = [
      {
        q: "周末没有安排，你理想的状态是？",
        options: [
          { text: "A. 约朋友出去逛街/聚餐，越热闹越好", scores: { E: 1 } },
          { text: "B. 窝在家里追剧/看书，享受独处", scores: { I: 1 } },
          { text: "C. 看心情，有人约就出去，没人约就宅着", scores: { E: 0.5, I: 0.5 } },
          { text: "D. 希望另一半安排好，我跟着就好", scores: { A: 1 } }
        ]
      },
      {
        q: "喜欢的人给你发了一条暧昧的消息，你会？",
        options: [
          { text: "A. 秒回！趁热打铁，把暧昧升级", scores: { E: 1, F: 0.5 } },
          { text: "B. 假装没看到，过一会儿再回", scores: { I: 1, T: 0.5 } },
          { text: "C. 反复读了好几遍，纠结怎么回才自然", scores: { I: 0.5, F: 1 } },
          { text: "D. 直接打电话过去，文字聊太慢了", scores: { E: 1, F: 0.5 } }
        ]
      },
      {
        q: "恋爱中你最害怕的事情是？",
        options: [
          { text: "A. 对方突然冷淡，消息不回电话不接", scores: { A: 1, F: 1 } },
          { text: "B. 被束缚住，失去自由和私人空间", scores: { E: 0.5, T: 0.5 } },
          { text: "C. 付出太多却没有得到同等回应", scores: { F: 1, A: 0.5 } },
          { text: "D. 吵架之后不知道怎么和好", scores: { I: 0.5, T: 0.5 } }
        ]
      },
      {
        q: "你更相信哪种表达方式的爱意？",
        options: [
          { text: "A. 每天说「我爱你」，甜言蜜语不能少", scores: { E: 1, F: 0.5 } },
          { text: "B. 记住你说过的每个细节，默默为你做事", scores: { I: 0.5, T: 0.5, S: 0.5 } },
          { text: "C. 愿意花时间陪你，哪怕什么都不做", scores: { S: 1, F: 0.5 } },
          { text: "D. 送你礼物/转账，实实在在的东西", scores: { T: 1, S: 0.5 } }
        ]
      },
      {
        q: "和另一半意见不合时，你通常会？",
        options: [
          { text: "A. 据理力争，我是对的就必须坚持", scores: { E: 1, T: 0.5 } },
          { text: "B. 先冷静一下，等情绪过了再沟通", scores: { T: 1, S: 0.5 } },
          { text: "C. 容易心软，对方一哄就好了", scores: { F: 1, A: 0.5 } },
          { text: "D. 不想吵，先回避，等事情自然过去", scores: { I: 1, T: 0.5 } }
        ]
      },

    let currentQuestion = 0;

    // ========== 核心逻辑 ==========
    function startTest() {
      document.getElementById('welcomePage').style.display = 'none';
      document.getElementById('testPage').style.display = 'block';
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('questionNum').textContent = `第${currentQuestion + 1}题`;
      document.getElementById('questionText').textContent = q.q;
      document.getElementById('progressNum').textContent = currentQuestion + 1;
      document.getElementById('progressFill').style.width = `${(currentQuestion + 1) * 10}%`;

      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn' + (answers[currentQuestion] === idx ? ' selected' : '');
        btn.textContent = opt.text;
        btn.onclick = () => selectOption(idx);
        container.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').textContent = currentQuestion === 9 ? '查看结果' : '下一题';
    }

    function selectOption(idx) {
      answers[currentQuestion] = idx;
      const btns = document.querySelectorAll('.option-btn');
      btns.forEach((btn, i) => {
        btn.classList.toggle('selected', i === idx);
      });
    }

    function nextQuestion() {
      if (answers[currentQuestion] === undefined) {
        alert('请先选择一个选项哦～');
        return;
      }
      if (currentQuestion < 9) {
        currentQuestion++;
        renderQuestion();
      } else {
        showResult();
      }
    }

    function prevQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        renderQuestion();
      }
    }

    function calculateResult() {
      const scores = { E: 0, I: 0, F: 0, T: 0, S: 0, A: 0 };

      answers.forEach((ansIdx, qIdx) => {
        const optionScores = questions[qIdx].options[ansIdx].scores;
        for (const [key, value] of Object.entries(optionScores)) {
          scores[key] += value;
        }
      });

      // 确定各维度倾向
      const energy = scores.E >= scores.I ? 'E' : 'I';
      const emotion = scores.F >= scores.T ? 'F' : 'T';
      const attach = scores.S >= scores.A ? 'S' : 'A';

      // 匹配人格
      const combo = energy + emotion + attach;

      const mapping = {
        'ETS': 'butterfly',
        'ETF': 'butterfly',
        'EFS': 'flame',
        'EFF': 'sunflower',
        'IFS': 'whale',
        'IFT': 'whale',
        'IFF': 'moon',
        'IEF': 'moon',
        'ISA': 'rose',
        'ITA': 'rose',
        'IFA': 'moon',
        'EFA': 'rose',
        'EIA': 'flame',
        'ESA': 'sunflower',
        'EAA': 'flame',
      };

      // 简单映射逻辑
      if (energy === 'E' && emotion === 'T' && attach === 'S') return 'butterfly';
      if (energy === 'E' && emotion === 'F' && attach === 'S') return 'flame';
      if (energy === 'I' && emotion === 'F' && attach === 'A') return 'moon';
      if (energy === 'I' && emotion === 'T' && attach === 'S') return 'whale';
      if (energy === 'E' && emotion === 'F' && attach === 'S') return 'sunflower';
      if (energy === 'I' && attach === 'A') return 'rose';

      // 更多匹配
      if (energy === 'E' && attach === 'A') return 'flame';
      if (energy === 'E' && emotion === 'T') return 'butterfly';
      if (emotion === 'F' && attach === 'S') return 'sunflower';
      if (attach === 'S' && emotion === 'T') return 'whale';

      return 'butterfly'; // default
    }
